<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maquette — Register (GameBattle)</title>
<style>
  :root {
    --bg:        #0a0a0f;
    --bg-glow:   #15151f;
    --card:      #14141c;
    --card-brd:  #26262f;
    --input-bg:  #0f0f16;
    --input-brd: #2c2c38;
    --txt:       #f4f4f5;
    --txt-mut:   #8b8b96;
    --txt-dim:   #5f5f6b;
    --accent:    #6d5cf6;
    --accent-h:  #7c6dff;
    --danger:    #f0506e;
    --radius:    14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: var(--txt);
    background:
      radial-gradient(900px 500px at 50% -10%, var(--bg-glow), transparent 70%),
      var(--bg);
    display: grid;
    place-items: center;
    padding: 32px 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 26px;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.01em;
  }
  .brand .logo {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #b46cff);
    display: grid; place-items: center;
    box-shadow: 0 0 24px rgba(109,92,246,.55);
    font-size: 16px;
  }

  .card {
    width: 400px;
    max-width: 100%;
    background: var(--card);
    border: 1px solid var(--card-brd);
    border-radius: 20px;
    padding: 32px 30px 28px;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,.7);
  }

  h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }
  .subtitle { color: var(--txt-mut); font-size: 14px; margin-top: 5px; }

  .field { margin-top: 18px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--txt-mut);
    margin-bottom: 7px;
  }
  .input-wrap { position: relative; }
  input {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--input-brd);
    border-radius: 10px;
    padding: 11px 13px;
    color: var(--txt);
    font-size: 14px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--txt-dim); }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(109,92,246,.18);
  }
  .eye {
    position: absolute;
    right: 11px; top: 50%;
    transform: translateY(-50%);
    color: var(--txt-dim);
    cursor: pointer;
    font-size: 15px;
    user-select: none;
  }

  /* barre de force du mot de passe */
  .meter { display: flex; gap: 5px; margin-top: 9px; align-items: center; }
  .meter .bars { display: flex; gap: 5px; flex: 1; }
  .meter .bar { height: 4px; flex: 1; border-radius: 99px; background: var(--input-brd); }
  .meter .bar.on { background: #f0a050; }
  .meter span { font-size: 12px; color: #f0a050; }

  .btn {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 22px;
    transition: background .15s, transform .05s;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 8px 24px -8px rgba(109,92,246,.7);
  }
  .btn-primary:hover { background: var(--accent-h); }

  .divider {
    display: flex; align-items: center; gap: 14px;
    margin: 22px 0 4px;
    color: var(--txt-dim); font-size: 12px;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px; background: var(--card-brd);
  }

  .btn-oauth {
    background: var(--input-bg);
    border: 1px solid var(--input-brd);
    color: var(--txt);
    margin-top: 14px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-oauth:hover { border-color: #3a3a48; background: #16161e; }
  .g {
    width: 18px; height: 18px; border-radius: 4px; background: #fff;
    display: grid; place-items: center; font-weight: 700; color: #4285f4; font-size: 12px;
  }

  .foot {
    text-align: center;
    margin-top: 22px;
    font-size: 13.5px;
    color: var(--txt-mut);
  }
  .foot a { color: var(--accent-h); text-decoration: none; font-weight: 500; }
  .foot a:hover { text-decoration: underline; }

  /* exemple d'état d'erreur (champ email) — décommente mentalement */
  .error-demo .err-input { border-color: var(--danger); }
  .error-demo .err-msg {
    color: var(--danger); font-size: 12.5px; margin-top: 6px;
  }
</style>
</head>
<body>
  <div>
    <div class="brand">
      <span class="logo">◆</span>
      <span>GameBattle</span>
    </div>

    <div class="card error-demo">
      <h1>Créer un compte</h1>
      <p class="subtitle">Rejoins la compétition</p>

      <div class="field">
        <label for="pseudo">Pseudo</label>
        <div class="input-wrap">
          <input id="pseudo" type="text" placeholder="ex: shadowSniper" value="shadowSniper" />
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <input id="email" class="err-input" type="email" placeholder="toi@exemple.com" value="toi@exemple.com" />
        </div>
        <div class="err-msg">Cet email est déjà utilisé.</div>
      </div>

      <div class="field">
        <label for="pwd">Mot de passe</label>
        <div class="input-wrap">
          <input id="pwd" type="password" placeholder="••••••••" value="secret123" />
          <span class="eye">👁</span>
        </div>
        <div class="meter">
          <div class="bars">
            <div class="bar on"></div>
            <div class="bar on"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
          <span>Moyen</span>
        </div>
      </div>

      <button class="btn btn-primary">S'inscrire</button>

      <div class="divider">ou</div>

      <button class="btn btn-oauth">
        <span class="g">G</span>
        Continuer avec Google
      </button>

      <p class="foot">Déjà un compte ? <a href="#">Se connecter</a></p>
    </div>
  </div>
</body>
</html>
