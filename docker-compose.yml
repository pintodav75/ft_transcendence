# Use postgres/example user/password credentials

services:
  frontend:
    build: ./frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # Cert dev généré par le backend, monté en LECTURE SEULE : Vite sert le front en HTTPS
      # sur la MÊME empreinte que le backend. Le frontend n'est jamais générateur de cert.
      - backend_certs:/app/certs:ro
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Cibles proxy INTERNES (réseau Docker) lues par vite.config.ts. Non préfixées VITE_ :
      # elles ne doivent PAS fuiter dans le bundle client. Obligatoires (`:?`) et SANS fallback :
      # une config incomplète doit échouer tôt, pas démarrer sur une valeur devinée.
      - API_PROXY_TARGET=${API_PROXY_TARGET:?API_PROXY_TARGET manquant (ex. https://backend:3000)}
      - MINIO_PROXY_TARGET=${MINIO_PROXY_TARGET:?MINIO_PROXY_TARGET manquant (ex. http://minio:9000)}
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    restart: always
    ports:
      - 3000:3000
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_certs:/app/certs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Variables OBLIGATOIRES : `${VAR:?message}` fait échouer `docker compose config`/`up` tôt
      # et clairement (nom de la variable) si l'une manque, au lieu de démarrer sur une chaîne vide.
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER manquant}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB manquant}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET manquant (openssl rand -hex 64)}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:?MINIO_ENDPOINT manquant}
      - MINIO_PORT=${MINIO_PORT:?MINIO_PORT manquant}
      - MINIO_USE_SSL=${MINIO_USE_SSL:?MINIO_USE_SSL manquant (true/false)}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER manquant}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD manquant}
      - MINIO_BUCKET=${MINIO_BUCKET:?MINIO_BUCKET manquant}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID manquant}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET manquant}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:?GOOGLE_REDIRECT_URI manquant (https://localhost:5173/api/auth/oauth/google/callback)}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL manquant (https://localhost:5173)}
      - REDIS_HOSTNAME=${REDIS_HOSTNAME:?REDIS_HOSTNAME manquant}
      - REDIS_PORT=${REDIS_PORT:?REDIS_PORT manquant}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD manquant}
      # Multiplicateur des quotas de rate-limit. Volontairement OPTIONNEL avec un repli sur 1 :
      # un `.env` qui ne la mentionne pas (celui d'un coéquipier, celui de la correction) tourne
      # avec les quotas de production. Voir backend/src/utils/rate-limit.ts.
      - RATE_LIMIT_FACTOR=${RATE_LIMIT_FACTOR:-1}
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:3000/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    ports:
      - 9000:9000
      - 9001:9001
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:0.9.1
    user: redis
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
    ports:
      - 8081:8081

  redis:
    image: docker.io/library/redis:8.8.0
    restart: always
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  adminer:
    image: docker.io/library/adminer:5.4.2
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 8080:8080

  postgres:
    image: docker.io/library/postgres:17.10
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  backend_certs:
