openapi: 3.0.3
info:
  title: ft_transcendence API
  description: >
    API REST du backend ft_transcendence (Fastify v5 + TypeScript).
    Auth JWT (access token Bearer 15 min) + refresh token en cookie httpOnly
    (SameSite=Strict). Le cookie est posé Path=/auth par le backend et réécrit en
    Path=/api/auth par le proxy Vite pour le navigateur (invariant I4). Chat temps réel
    hors-OpenAPI via WebSocket `/ws/chat` (documenté en fin de fichier pour mémoire).
  version: 0.9.0
  contact:
    name: ft_transcendence team

servers:
  # Origine applicative PRINCIPALE (navigateur) : tout passe par le proxy Vite same-origin.
  # Les chemins ci-dessous sont relatifs à cette base — /auth/login s'appelle donc
  # https://localhost:5173/api/auth/login côté navigateur.
  - url: https://localhost:5173/api
    description: App proxifiée (origine unique navigateur, I4)
  # Backend en direct : diagnostic, tests e2e Python et curl uniquement (hors navigateur app).
  - url: https://localhost:3000
    description: Backend direct (diagnostic / tests, HTTPS certificat auto-signé)

tags:
  - name: Auth
    description: Inscription, connexion, session, refresh
  - name: OAuth
    description: Connexion Google (OAuth 2.0)
  - name: 2FA
    description: Double authentification TOTP
  - name: Users
    description: Profil utilisateur et avatar
  - name: External accounts
    description: Liaisons de comptes in-game (§5.1 — requis pour jouer)
  - name: Friends
    description: Demandes d'amis et liste d'amis
  - name: Messages
    description: Historique des messages directs
  - name: Blocks
    description: Blocage symétrique d'utilisateurs (rompt l'amitié, masque le profil)
  - name: Games
    description: Catalogue des jeux supportés (lecture seule, seed initial)
  - name: Ladders
    description: Compétitions = jeu × format (lecture seule, seed initial)
  - name: Teams
    description: Équipes par ladder (CRUD, membres, capitaine) — socle du matchmaking
  - name: Matchmaking
    description: Slots de match (créer / lister / détail) — §5.1 lineup, §5.2 lockout, tirage maps BO3
  - name: Disputes
    description: >
      Litiges de score (B7). Une dispute naît d'un désaccord de score (B6 met le match en
      `disputed`) — pas d'endpoint « ouvrir une dispute ». B7 en est la seule sortie : dépôt
      de preuve+message, arbitrage admin, ou auto-annulation par le job 24 h.
  - name: Notifications
    description: >
      Notifications système (B9). Écrites EXCLUSIVEMENT par le backend (accept, score,
      disputes, jobs 24 h) — aucune route de création. Source de vérité en base ; push
      temps réel best-effort par-dessus via l'event `notification` de `/ws/chat`
      (documenté en fin de fichier).
  - name: Search
    description: >
      Recherche globale préfixe (joueurs + teams) pour la barre du rail gauche. Insensible
      à la casse, blocages exclus (les deux sens), résultats bornés et tagués par type.
  - name: System
    description: Endpoints utilitaires

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token signé (payload `{ sub }`). Les tempTokens 2FA
        (`{ sub, pending: 'totp' }`) sont refusés sur les routes protégées.

  schemas:
    # ---------- Erreurs ----------
    Error:
      type: object
      properties:
        error:
          type: string
          example: Unauthorized
      required: [error]

    RateLimitError:
      type: object
      description: >
        Corps d'un 429. ⚠️ Ce N'EST PAS le schéma `Error` : il est produit par
        @fastify/rate-limit, pas par nos handlers, et porte trois champs.
      properties:
        statusCode:
          type: integer
          example: 429
        error:
          type: string
          example: Too Many Requests
        message:
          type: string
          example: Rate limit exceeded, retry in 1 minute
      required: [statusCode, error, message]

    ValidationError:
      type: object
      description: Erreur de validation Zod (issues brutes).
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: too_small
              path:
                type: array
                items:
                  type: string
              message:
                type: string
                example: au moins 8 caractères
      required: [errors]

    Ok:
      type: object
      properties:
        ok:
          type: boolean
          example: true
      required: [ok]

    # ---------- User ----------
    User:
      type: object
      description: Profil complet du user authentifié (sans passwordHash ni totpSecret).
      properties:
        id:
          type: string
          format: uuid
        pseudo:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        oauthProvider:
          type: string
          nullable: true
          example: google
        oauthId:
          type: string
          nullable: true
        totpEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, pseudo, email, totpEnabled, createdAt, updatedAt]

    PublicUser:
      type: object
      description: >
        Profil public (GET /users/{pseudo}) — email, updatedAt, totpEnabled
        et secrets retirés.
      properties:
        id:
          type: string
          format: uuid
        pseudo:
          type: string
        displayName:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        oauthProvider:
          type: string
          nullable: true
        oauthId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, pseudo, createdAt]

    FriendSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pseudo:
          type: string
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true

    # ---------- Friendship ----------
    Friendship:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requesterId:
          type: string
          format: uuid
        addresseeId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ---------- Message ----------
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        receiverId:
          type: string
          format: uuid
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    # ---------- Conversation summary ----------
    ConversationSummary:
      type: object
      required: [friend, lastMessage]
      properties:
        friend:
          $ref: '#/components/schemas/FriendSummary'
        lastMessage:
          type: object
          properties:
            id:
              type: string
              format: uuid
            senderId:
              type: string
              format: uuid
            receiverId:
              type: string
              format: uuid
            content:
              type: string
            createdAt:
              type: string
              format: date-time
          required: [id, senderId, receiverId, content, createdAt]

    # ---------- Auth payloads ----------
    AuthSuccess:
      type: object
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required: [accessToken, user]

    Requires2FA:
      type: object
      properties:
        requires2FA:
          type: boolean
          example: true
        tempToken:
          type: string
          description: Token temporaire (TTL 5 min) à présenter à POST /auth/2fa/verify.
      required: [requires2FA, tempToken]

    # ---------- Blocks ----------
    BlockEntry:
      type: object
      description: Un user bloqué (retourné par GET /blocks).
      properties:
        id:
          type: string
          format: uuid
        pseudo:
          type: string
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        since:
          type: string
          format: date-time
          description: createdAt de la ligne `blocks`.
      required: [id, pseudo, since]

    # ---------- Catalog (games + ladders) ----------
    Game:
      type: object
      description: Un jeu supporté par la plateforme.
      properties:
        id:
          type: string
          description: Slug du jeu (PK).
          example: cs2
        name:
          type: string
          example: Counter-Strike 2
        requiredProvider:
          type: string
          enum: [riot, steam, epic, chess_com]
          description: Provider d'identifiant in-game requis pour s'inscrire à un match de ce jeu.
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, name, requiredProvider, isActive, createdAt]

    Ladder:
      type: object
      description: Une compétition (jeu × format) avec son ELO indépendant.
      properties:
        id:
          type: string
          format: uuid
        gameId:
          type: string
          example: cs2
        format:
          type: string
          enum: ['1v1', '2v2', '3v3', '5v5']
        name:
          type: string
          example: Counter-Strike 2 5v5
        lockoutMinutes:
          type: integer
          description: >
            Durée pendant laquelle la team/user est verrouillée autour d'un match :
            elle ne peut pas prendre un second créneau à moins de lockoutMinutes
            de celui-ci, avant comme après.
            ⚠️ NE régit PAS la soumission de score : la seule garde y est
            scheduledAt (POST /matches/{id}/result refuse un match dont l'heure
            n'est pas passée, 400 « match not started yet »). L'ancienne phrase
            « aussi le délai minimum avant soumission de score » était fausse.
          example: 60
        createdAt:
          type: string
          format: date-time
      required: [id, gameId, format, name, lockoutMinutes, createdAt]

    # ---------- External accounts (in-game) ----------
    ExternalAccount:
      type: object
      description: Un compte externe (in-game) lié par l'user (§5.1 du design).
      properties:
        provider:
          type: string
          enum: [riot, steam, epic, chess_com]
        externalId:
          type: string
          description: Identifiant du compte chez le provider (saisi manuellement au MVP).
          example: STEAM_76561198000000000
        verified:
          type: boolean
          description: >
            true si la liaison a été vérifiée (OAuth futur). Au MVP toujours false
            (liaison manuelle déclarative).
      required: [provider, externalId, verified]

    # ---------- Teams ----------
    Team:
      type: object
      description: Ligne brute d'une équipe (renvoyée à la création).
      properties:
        id: { type: string, format: uuid }
        ladderId: { type: string, format: uuid }
        name: { type: string, maxLength: 50 }
        captainId: { type: string, format: uuid }
        logoUrl:
          type: string
          nullable: true
          description: >
            **Deux formes possibles** — le front doit accepter les deux : un chemin RELATIF
            `/media/avatars/<uuid>.<ext>` quand le logo a été uploadé via
            `POST /teams/{id}/logo`, ou une URL absolue `https://…` quand il a été saisi via
            `POST /teams` / `PATCH /teams/{id}`. `null` = pas de logo.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, ladderId, name, captainId, logoUrl, createdAt, updatedAt]

    TeamCreateConflict:
      type: object
      description: >
        Conflit renvoyé par POST /teams. Le client doit tester `code`, pas
        parser `error` : `error` est un texte d'affichage susceptible de
        changer, `code` est stable.
      properties:
        error: { type: string, description: 'Message lisible, destiné à l’affichage.' }
        code:
          type: string
          enum: [name_taken, already_in_team, conflict]
          description: Valeur stable à tester par le client.
      required: [error, code]

    TeamListItem:
      type: object
      description: Une de mes teams (GET /teams), infos ladder aplaties.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        ladderId: { type: string, format: uuid }
        ladder:
          type: string
          description: Nom du ladder
        format: { type: string, enum: [1v1, 2v2, 3v3, 5v5] }
        gameId: { type: string }
        isCaptain: { type: boolean }
        logoUrl:
          type: string
          nullable: true
          description: >
            Chemin relatif `/media/avatars/…` (upload) **ou** URL absolue `https://…`
            (saisie) — cf. `Team.logoUrl`.
      required: [id, name, ladderId, ladder, format, gameId, isCaptain, logoUrl]

    TeamDetail:
      type: object
      description: Détail d'une team (GET /teams/{id}), infos ladder aplaties.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        ladderId: { type: string, format: uuid }
        ladderName: { type: string }
        format: { type: string, enum: [1v1, 2v2, 3v3, 5v5] }
        gameId: { type: string }
        requiredProvider:
          type: string
          enum: [riot, steam, epic, chess_com]
          description: >
            Le provider imposé par le JEU de ce ladder (§5.1). Le front sait ainsi quel
            message afficher (« compte Riot non lié ») pour les membres non sélectionnables.
        captainId: { type: string, format: uuid }
        logoUrl:
          type: string
          nullable: true
          description: >
            Chemin relatif `/media/avatars/…` (upload) **ou** URL absolue `https://…`
            (saisie) — cf. `Team.logoUrl`.
      required:
        [id, name, ladderId, ladderName, format, gameId, requiredProvider, captainId, logoUrl]

    TeamMember:
      type: object
      description: Un membre d'une team (le capitaine y figure avec isCaptain=true).
      properties:
        id: { type: string, format: uuid }
        pseudo: { type: string }
        displayName: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        isCaptain: { type: boolean }
        hasLinkedAccount:
          type: boolean
          description: >
            §5.1 — ce membre a-t-il un compte lié pour le `requiredProvider` du jeu ?
            `false` = **non sélectionnable dans une lineup** → le front le grise AVANT que
            le capitaine ne compose son équipe (prévenir plutôt que refuser).
      required: [id, pseudo, displayName, avatarUrl, isCaptain, hasLinkedAccount]

    TeamInvitationUser:
      type: object
      description: Le joueur porté par une invitation (projection publique, jamais l'email).
      properties:
        id: { type: string, format: uuid }
        pseudo: { type: string }
        displayName: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
      required: [id, pseudo, displayName, avatarUrl]

    TeamInvitation:
      type: object
      description: >
        Vue **côté équipe** d'une invitation (B-INV) : QUI a été sollicité. Servie par
        `POST /teams/{id}/invitations` et par le bloc `invitations` de `GET /teams/{id}`
        (membres uniquement) — la forme est volontairement **identique** dans les deux.
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        ladderId: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, accepted, declined, cancelled]
          description: >
            `cancelled` couvre **deux** cas : l'annulation par le capitaine ET l'annulation
            automatique quand le joueur accepte ailleurs sur le même ladder. C'est ce qui
            évite d'afficher « a refusé » à un capitaine qui a lui-même annulé.
        invitedBy:
          type: string
          format: uuid
          description: Le capitaine à l'origine de l'invitation.
        createdAt: { type: string, format: date-time }
        user:
          $ref: '#/components/schemas/TeamInvitationUser'
      required: [id, teamId, ladderId, status, invitedBy, createdAt, user]

    MyTeamInvitation:
      type: object
      description: >
        Vue **côté joueur** d'une invitation (`GET /teams/invitations/me`) : QUELLE équipe
        me sollicite. Le joueur, lui, c'est moi — d'où l'absence de champ `user`.
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending]
          description: Toujours `pending` — la route ne liste que les invitations vivantes.
        createdAt: { type: string, format: date-time }
        team:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            logoUrl:
              type: string
              nullable: true
              description: Chemin relatif `/media/avatars/…` ou URL absolue — cf. `Team.logoUrl`.
            ladderId: { type: string, format: uuid }
            ladderName: { type: string }
            format: { type: string, enum: [1v1, 2v2, 3v3, 5v5] }
            gameId: { type: string }
          required: [id, name, logoUrl, ladderId, ladderName, format, gameId]
        invitedBy:
          $ref: '#/components/schemas/TeamInvitationUser'
      required: [id, status, createdAt, team, invitedBy]

    AccountDeletionError:
      type: object
      description: >
        Refus de `DELETE /users/me`. Même contrat que `TeamInvitationError` : `code` est
        stable et destiné au mapping, `error` est un texte d'affichage qui peut changer.
      properties:
        error: { type: string, description: 'Message lisible, destiné à l’affichage.' }
        code:
          type: string
          enum: [engaged_in_match, captain_of_team]
          description: >
            `engaged_in_match` — un match `pending`, `in_progress`, `awaiting_confirmation`
            ou `disputed` aligne encore ce compte : il faut le jouer ou l'annuler d'abord.
            `captain_of_team` — le compte est capitaine d'une équipe : il faut la dissoudre
            (`DELETE /teams/{id}`) avant de partir, sinon la cascade l'effacerait pour tout
            le roster. Les deux se testent dans cet ordre.
      required: [error, code]

    TeamInvitationError:
      type: object
      description: >
        Erreur des routes d'invitation. Le client doit tester `code`, **pas** parser
        `error` : `error` est un texte d'affichage susceptible de changer, `code` est stable.
      properties:
        error: { type: string, description: 'Message lisible, destiné à l’affichage.' }
        code:
          type: string
          enum:
            [
              not_captain,
              team_not_found,
              user_not_found,
              invitation_not_found,
              not_your_invitation,
              already_member,
              already_invited,
              already_in_team_on_ladder,
              already_in_team,
              roster_full,
              not_pending,
              conflict,
            ]
          description: Valeur stable à tester par le client.
      required: [error, code]

    UnlinkedPlayersError:
      type: object
      description: >
        400 spécifique au §5.1 en 2v2+ : un ou plusieurs joueurs de la lineup n'ont pas
        de compte lié. `unlinkedPlayers` dit **lesquels** — sans lui, le capitaine devrait
        deviner parmi ses 5 sélectionnés.
      properties:
        error:
          type: string
          example: every selected player must have a linked riot account
        unlinkedPlayers:
          type: array
          items: { type: string, format: uuid }
      required: [error, unlinkedPlayers]

  responses:
    Unauthorized:
      description: Token absent, invalide ou expiré
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Erreur interne
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  # =====================================================================
  # AUTH
  # =====================================================================
  /auth/register:
    post:
      tags: [Auth]
      summary: Créer un compte
      description: >
        Crée un user, hash le password (bcrypt cost 12), pose le cookie refresh
        et renvoie un access token. Password fort exigé.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pseudo:
                  type: string
                  minLength: 3
                  maxLength: 30
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  description: >
                    ≥ 8 caractères, au moins une majuscule, une minuscule,
                    un chiffre et un caractère spécial.
              required: [pseudo, email, password]
      responses:
        '201':
          description: Compte créé
          headers:
            Set-Cookie:
              description: >
                refresh (httpOnly, Secure, SameSite=Strict, 7j). Path=/auth côté backend,
                réécrit en Path=/api/auth par le proxy Vite pour le navigateur (I4).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccess'
        '400':
          description: Validation échouée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: Pseudo ou email déjà pris
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Se connecter
      description: >
        Vérifie email + password. Si 2FA activée, renvoie `{ requires2FA, tempToken }`
        SANS cookie ni accessToken. Sinon flux normal. Comptes OAuth-only
        (sans password) renvoient 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required: [email, password]
      responses:
        '200':
          description: Connexion réussie OU 2FA requise
          headers:
            Set-Cookie:
              description: refresh (seulement si 2FA non activée)
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthSuccess'
                  - $ref: '#/components/schemas/Requires2FA'
        '400':
          description: Validation échouée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renouveler l'access token
      description: >
        Lit le cookie refresh et émet un nouvel access token. Le front appelle cette route à
        l'ouverture de chaque page, y compris anonyme, pour tenter de restaurer une session :
        l'absence de cookie n'est donc PAS un échec (204), seul un cookie présent mais
        refusé en est un (401).
      responses:
        '200':
          description: Nouvel access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                required: [accessToken]
        '204':
          description: >
            Aucun cookie de refresh : il n'y a pas de session à restaurer. **Corps vide** —
            le client doit traiter ce cas explicitement, sans le confondre avec un 200.
        '401':
          description: >
            Cookie de refresh présent mais refusé : invalide, expiré, de mauvais type, ou
            utilisateur supprimé. ⚠️ **N'inclut plus le cookie absent** (204 depuis B13).
            Le cookie mort est **effacé** (`Set-Cookie` expiré) pour que l'appel suivant
            retombe sur le 204 silencieux plutôt que de répéter ce 401 indéfiniment ;
            une panne serveur, elle, rend 401 **sans** toucher au cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Se déconnecter
      description: Efface le cookie refresh.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'

  # =====================================================================
  # OAUTH GOOGLE
  # =====================================================================
  /auth/oauth/google/start:
    get:
      tags: [OAuth]
      summary: Démarrer le flow Google
      description: >
        Redirige (302) vers l'écran de consentement Google. Route fournie
        par @fastify/oauth2 (startRedirectPath). Scopes : profile, email.
      responses:
        '302':
          description: Redirection vers Google

  /auth/oauth/google/callback:
    get:
      tags: [OAuth]
      summary: Callback Google
      description: >
        Échange le code, récupère le profil Google, applique le linking
        3-cas (A: déjà lié / B: lié par email / C: nouveau compte), pose le
        cookie refresh et renvoie un access token.
      parameters:
        - in: query
          name: code
          schema:
            type: string
          description: Code d'autorisation fourni par Google
        - in: query
          name: state
          schema:
            type: string
      responses:
        '200':
          description: Connexion OAuth réussie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccess'
        '500':
          description: Échec du login OAuth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # =====================================================================
  # 2FA TOTP
  # =====================================================================
  /auth/2fa/setup:
    post:
      tags: [2FA]
      summary: Initialiser la 2FA
      description: Génère un secret base32 + QR code (data URL). Stocke le secret.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Secret + QR code
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                    description: Secret base32 (à saisir manuellement si besoin)
                  qrCodeDataUrl:
                    type: string
                    description: Image PNG en data URL pour l'app TOTP
                required: [secret, qrCodeDataUrl]
        '400':
          description: 2FA déjà activée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/2fa/enable:
    post:
      tags: [2FA]
      summary: Activer la 2FA
      description: Vérifie le 1er code TOTP et passe totp_enabled à true.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: '^\d{6}$'
                  example: '123456'
              required: [code]
      responses:
        '200':
          description: 2FA activée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Code invalide, 2FA non configurée ou déjà activée
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/2fa/disable:
    post:
      tags: [2FA]
      summary: Désactiver la 2FA
      description: Exige un code TOTP valide, puis reset secret + flag.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: '^\d{6}$'
              required: [code]
      responses:
        '200':
          description: 2FA désactivée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Code invalide ou 2FA non activée
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/2fa/verify:
    post:
      tags: [2FA]
      summary: Vérifier le code 2FA au login
      description: >
        Consomme le tempToken renvoyé par /auth/login, vérifie le code TOTP,
        puis émet un vrai access token + cookie refresh. Pas d'auth Bearer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tempToken:
                  type: string
                code:
                  type: string
                  pattern: '^\d{6}$'
              required: [tempToken, code]
      responses:
        '200':
          description: Connexion finalisée
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccess'
        '400':
          description: Code invalide, 2FA non activée ou validation échouée
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationError'
        '401':
          description: tempToken invalide/expiré ou mauvais type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: >
            Rate limit dépassé. Deux compteurs distincts peuvent le produire (B12) :
            **5 essais/min par COMPTE** visé par le tempToken — le budget d'essais de code,
            identique quel que soit le nombre d'adresses employées — et un plancher de
            **30 req/min par IP** qui borne tout le reste, c'est-à-dire les requêtes ne
            portant pas de tempToken exploitable (corps illisible, token absent, expiré ou
            de mauvais type). En-têtes `x-ratelimit-*` et `retry-after` dans les deux cas ;
            seul le libellé de `message` diffère selon le compteur qui a coupé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'

  # =====================================================================
  # USERS
  # =====================================================================
  /users/me:
    get:
      tags: [Users]
      summary: Mon profil
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Users]
      summary: Modifier mon profil
      description: Mise à jour partielle de displayName et/ou bio (au moins un champ).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 50
                bio:
                  type: string
                  maxLength: 280
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Aucun champ fourni ou validation échouée
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Users]
      summary: Supprimer mon compte
      description: >
        Suppression définitive. Exige `password` si l'user en a un (sinon ignoré
        pour les comptes OAuth-only) et `totpCode` si la 2FA est activée. Supprime
        en cascade friendships, messages, blocks, le classement personnel et les lignes de
        composition (`match_participants`). **Les matchs eux-mêmes ne sont pas touchés** :
        score, vainqueur et deltas d'Elo vivent sur `matches` / `match_sides`, seul « qui
        était aligné » disparaît des vieilles compositions. L'avatar MinIO est retiré après
        coup (non-bloquant). Le cookie refresh est nettoyé.
        ⚠️ **Deux refus en 409**, avec deux remèdes différents : un match **non terminé** qui
        aligne le compte (`engaged_in_match` ; un match `completed` ou `cancelled` ne bloque
        rien), et le fait d'être **capitaine d'une équipe** (`captain_of_team` — la FK est en
        cascade, partir effacerait l'équipe et son classement pour tout le roster).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Requis si user a un password_hash.
                totpCode:
                  type: string
                  pattern: '^\d{6}$'
                  description: Requis si totp_enabled.
      responses:
        '200':
          description: Compte supprimé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Validation échouée (champ requis manquant)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationError'
        '401':
          description: Password ou code TOTP invalide, ou token absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            Le compte est engagé dans un match non terminé (aligné dans une composition, ou
            capitaine d'une équipe dont un camp est engagé). Le client doit tester `code`,
            **pas** parser `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionError'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me/password:
    patch:
      tags: [Users]
      summary: Changer son mot de passe
      description: >
        Change le mot de passe de l'utilisateur courant. `currentPassword` est vérifié
        contre le hash existant (**401** si faux) ; `newPassword` doit respecter la **même
        règle que l'inscription** (≥ 8 car., 1 majuscule, 1 minuscule, 1 chiffre, 1 spécial
        — **400** sinon). Un compte **OAuth-only** (jamais de mot de passe local) → **400**
        (définir un premier mot de passe serait un flux séparé). Rate-limit **5/min** par
        route. Les sessions/refresh tokens existants ne sont PAS invalidés (pas d'infra de
        révocation dans le stack).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 72
                  description: ≥ 8 car., 1 majuscule, 1 minuscule, 1 chiffre, 1 spécial.
      responses:
        '200':
          description: Mot de passe changé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: >
            `newPassword` non conforme (ValidationError) ou compte OAuth-only sans mot de
            passe local (Error).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationError'
        '401':
          description: Non authentifié, ou `currentPassword` incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit dépassé (5/min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me/avatar:
    post:
      tags: [Users]
      summary: Uploader un avatar
      description: >
        Upload multipart (limite 2 MB). MIME autorisés : image/jpeg, image/png,
        image/webp. Stocke dans MinIO et met à jour avatar_url.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        '200':
          description: Avatar mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Pas multipart, aucun fichier ou type non supporté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Fichier trop volumineux (> 2 MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Users]
      summary: Supprimer son avatar
      description: >
        Supprime l'objet MinIO de l'avatar (si présent) et remet avatar_url à null.
        Idempotente : sans avatar, renvoie l'utilisateur inchangé. Le front retombe
        alors sur l'avatar par défaut.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Avatar supprimé (ou déjà absent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # =====================================================================
  # EXTERNAL ACCOUNTS (in-game)
  # =====================================================================
  /users/me/external-accounts:
    get:
      tags: [External accounts]
      summary: Liste mes comptes externes liés
      description: >
        Renvoie les liaisons in-game de l'user authentifié (0 à 4, une par
        provider). Liste vide si aucune liaison — pas une erreur (jamais 404).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des comptes liés
          content:
            application/json:
              schema:
                type: object
                properties:
                  externalAccounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalAccount'
                required: [externalAccounts]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [External accounts]
      summary: Lier un compte externe
      description: >
        Lie un compte in-game à l'user (MVP manuel → `verified = false`).
        Un seul compte par provider (contrainte UNIQUE(user_id, provider)).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum: [riot, steam, epic, chess_com]
                externalId:
                  type: string
                  minLength: 1
                  example: Faker#KR1
              required: [provider, externalId]
      responses:
        '201':
          description: Liaison créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  externalAccount:
                    $ref: '#/components/schemas/ExternalAccount'
                required: [externalAccount]
        '400':
          description: Body invalide (provider hors enum, externalId vide)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Provider déjà lié pour cet user (SQLSTATE 23505)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me/external-accounts/{provider}:
    delete:
      tags: [External accounts]
      summary: Délier un compte externe
      description: >
        Retire la liaison de ce provider pour l'user. Idempotent
        (200 même si aucune liaison existante).
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [riot, steam, epic, chess_com]
      responses:
        '200':
          description: Liaison retirée (ou aucune existante)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Provider invalide (hors enum)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{pseudo}:
    get:
      tags: [Users]
      summary: Profil public d'un user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: pseudo
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/PublicUser'
        '404':
          description: Profil introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # =====================================================================
  # FRIENDS
  # =====================================================================
  /friends:
    post:
      tags: [Friends]
      summary: Envoyer une demande d'ami
      description: >
        Logique 4-cas : pas de relation → pending (201) ; demande inverse
        existante → auto-accept (200) ; même sens pending → 400 ;
        déjà amis → 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                addresseeId:
                  type: string
                  format: uuid
              required: [addresseeId]
      responses:
        '201':
          description: Demande créée (pending)
          content:
            application/json:
              schema:
                type: object
                properties:
                  friendship:
                    $ref: '#/components/schemas/Friendship'
        '200':
          description: Demande inverse auto-acceptée
          content:
            application/json:
              schema:
                type: object
                properties:
                  friendship:
                    $ref: '#/components/schemas/Friendship'
        '400':
          description: Soi-même, déjà demandé ou déjà amis
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationError'
        '404':
          description: User cible introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Friends]
      summary: Liste de mes amis
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  friends:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/FriendSummary'
                        - type: object
                          properties:
                            since:
                              type: string
                              format: date-time
        '500':
          $ref: '#/components/responses/InternalError'

  /friends/requests:
    get:
      tags: [Friends]
      summary: Demandes d'amis (reçues ou envoyées, pending)
      description: >
        `direction=received` (défaut) renvoie les demandes reçues avec la clé
        `from:` (l'expéditeur). `direction=sent` renvoie mes demandes envoyées
        avec la clé `to:` (le destinataire). Dans les deux cas, uniquement les
        demandes `pending`.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: direction
          required: false
          schema:
            type: string
            enum: [sent, received]
            default: received
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        sentAt:
                          type: string
                          format: date-time
                        from:
                          description: Présent uniquement pour direction=received.
                          $ref: '#/components/schemas/FriendSummary'
                        to:
                          description: Présent uniquement pour direction=sent.
                          $ref: '#/components/schemas/FriendSummary'
        '400':
          description: Param direction invalide (ValidationError)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /friends/{id}/accept:
    post:
      tags: [Friends]
      summary: Accepter une demande
      description: Seul l'addressee peut accepter.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Demande acceptée
          content:
            application/json:
              schema:
                type: object
                properties:
                  friendship:
                    $ref: '#/components/schemas/Friendship'
        '400':
          description: >
            Param :id non-uuid (ValidationError) ou déjà amis — status non pending (Error)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
        '403':
          description: Non autorisé (pas l'addressee)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Amitié introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /friends/{id}/reject:
    post:
      tags: [Friends]
      summary: Refuser une demande
      description: Seul l'addressee peut refuser. La ligne est supprimée.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Demande refusée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: >
            Param :id non-uuid (ValidationError) ou status non pending (Error)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
        '403':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Amitié introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /friends/{id}:
    delete:
      tags: [Friends]
      summary: Supprimer un ami ou annuler une demande envoyée
      description: >
        Deux usages selon l'état de la relation. Amitié `accepted` -> unfriend
        (les deux parties, requester ou addressee, peuvent supprimer). Demande
        `pending` dont je suis le requester -> annulation de ma demande envoyée.
        Une demande `pending` que j'ai reçue (je suis l'addressee) n'est PAS
        supprimable ici -> 400 (le refus passe par POST /:id/reject).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Amitié supprimée ou demande envoyée annulée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: >
            Param :id non-uuid (ValidationError) ou action non permise sur cet
            état — pending reçue, etc. (Error)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
        '403':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Amitié introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # =====================================================================
  # MESSAGES
  # =====================================================================
  /messages/conversations:
    get:
      tags: [Messages]
      summary: Liste des conversations
      description: >
        Pour chaque ami accepté avec qui j'ai échangé, le dernier message de la
        conversation. Trié par date du dernier message décroissante (le plus
        récent d'abord). Aucun champ de présence (elle vient du WebSocket côté
        front). Amis acceptés uniquement (bloquer supprime déjà l'amitié).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [conversations]
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConversationSummary'
        '500':
          $ref: '#/components/responses/InternalError'

  /messages/{friendId}:
    get:
      tags: [Messages]
      summary: Historique de conversation
      description: >
        Renvoie les 100 derniers messages échangés avec un ami (ordre
        chronologique). Réservé aux amitiés acceptées.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: friendId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
        '400':
          description: Param :friendId non-uuid (ValidationError)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Pas amis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # =====================================================================
  # BLOCKS
  # =====================================================================
  /blocks:
    get:
      tags: [Blocks]
      summary: Liste des users que j'ai bloqués
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des blocages
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocks:
                    type: array
                    items:
                      $ref: '#/components/schemas/BlockEntry'
                required: [blocks]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /blocks/{userId}:
    post:
      tags: [Blocks]
      summary: Bloquer un user
      description: >
        Bloque l'user et rompt toute amitié existante entre les deux
        (DELETE friendship dans les deux sens). Pas idempotent : un 2e
        appel renvoie 400 'already blocked'.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Blocage effectué
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: >
            Param :userId non-uuid (ValidationError) ; auto-blocage tenté ou déjà bloqué
            — SQLSTATE 23505 (Error)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User cible introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Blocks]
      summary: Débloquer un user
      description: >
        Retire la ligne `blocks` de moi vers cet user. Idempotent
        (200 même si pas bloqué).
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Déblocage effectué (ou aucun blocage existant)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Param :userId non-uuid (ValidationError)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # =====================================================================
  # GAMES
  # =====================================================================
  /games:
    get:
      tags: [Games]
      summary: Liste les jeux supportés
      description: Renvoie tous les jeux avec `is_active = true`, triés par nom.
      responses:
        '200':
          description: Liste des jeux actifs
          content:
            application/json:
              schema:
                type: object
                properties:
                  games:
                    type: array
                    items:
                      $ref: '#/components/schemas/Game'
                required: [games]
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}:
    get:
      tags: [Games]
      summary: Détails d'un jeu
      description: Lookup par slug (`lol`, `cs2`, `val`, `rl`, `chess`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
            example: cs2
      responses:
        '200':
          description: Le jeu demandé
          content:
            application/json:
              schema:
                type: object
                properties:
                  game:
                    $ref: '#/components/schemas/Game'
                required: [game]
        '400':
          description: >
            Param :id hors bornes — 1 à 50 caractères (ValidationError). `games.id` est un
            slug `text`, pas un uuid : un slug bien formé mais inconnu reste un 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Jeu inconnu ou inactif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # =====================================================================
  # LADDERS
  # =====================================================================
  /ladders:
    get:
      tags: [Ladders]
      summary: Liste les ladders
      description: >
        Renvoie tous les ladders triés par nom. Filtre optionnel par
        `gameId` (slug du jeu). Un `gameId` inconnu renvoie une liste vide
        (pas d'erreur).
      parameters:
        - name: gameId
          in: query
          required: false
          schema:
            type: string
            example: cs2
          description: Filtre les ladders pour un jeu donné.
      responses:
        '200':
          description: Liste des ladders
          content:
            application/json:
              schema:
                type: object
                properties:
                  ladders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ladder'
                required: [ladders]
        '500':
          $ref: '#/components/responses/InternalError'

  /ladders/{id}:
    get:
      tags: [Ladders]
      summary: Détails d'un ladder (avec son jeu joint)
      description: >
        Lookup par uuid du ladder. Renvoie le ladder + le jeu parent
        (JOIN pour éviter au frontend un 2e appel sur `GET /games/{id}`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Le ladder demandé, son jeu parent et le pool de maps du jeu
          content:
            application/json:
              schema:
                type: object
                properties:
                  ladder:
                    $ref: '#/components/schemas/Ladder'
                  game:
                    $ref: '#/components/schemas/Game'
                  maps:
                    type: array
                    description: >
                      Pool de maps du JEU du ladder (table `game_maps`), trié par nom —
                      la même source que celle où `POST /matches` pioche les maps d'un
                      match. Toujours présent ; **vide** pour un jeu sans maps
                      (lol, rl, chess), ce qui n'est pas une erreur.
                    items:
                      type: string
                      example: Dust2
                required: [ladder, game, maps]
        '400':
          description: Param :id non-uuid (ValidationError)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Ladder inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /ladders/{id}/rankings:
    get:
      tags: [Ladders]
      summary: Classement (leaderboard) d'un ladder
      description: >
        Renvoie le classement du ladder, trié par ELO décroissant. Chaque
        entrée porte un `competitor` qui est soit un joueur (`type: user`),
        soit une équipe (`type: team`) selon le ladder. Un ladder existant
        sans classement renvoie une liste vide (pas d'erreur).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Classement trié par ELO décroissant (peut être vide)
          content:
            application/json:
              schema:
                type: object
                properties:
                  rankings:
                    type: array
                    items:
                      type: object
                      properties:
                        rank:
                          type: integer
                          example: 1
                        elo:
                          type: integer
                          example: 1580
                        wins:
                          type: integer
                        losses:
                          type: integer
                        competitor:
                          oneOf:
                            - type: object
                              properties:
                                type:
                                  type: string
                                  enum: [user]
                                id:
                                  type: string
                                  format: uuid
                                pseudo:
                                  type: string
                                displayName:
                                  type: string
                                  nullable: true
                                avatarUrl:
                                  type: string
                                  nullable: true
                              required: [type, id, pseudo]
                            - type: object
                              properties:
                                type:
                                  type: string
                                  enum: [team]
                                id:
                                  type: string
                                  format: uuid
                                name:
                                  type: string
                                logoUrl:
                                  type: string
                                  nullable: true
                              required: [type, id, name]
                      required: [rank, elo, wins, losses, competitor]
                required: [rankings]
        '400':
          description: Param :id non-uuid (ValidationError)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Ladder inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # =====================================================================
  # TEAMS
  # =====================================================================
  /teams:
    post:
      tags: [Teams]
      summary: Créer une équipe
      description: >
        Crée une team sur un ladder d'équipe (2v2+). Le créateur devient
        capitaine ET premier membre (transaction). Refusé sur un ladder 1v1
        (solo). Roster plafonné à 10 (membres + invitations en attente).


        ⚠️ **Effet de bord (B-INV)** : dans la **même transaction**, les invitations encore
        `pending` que le créateur avait reçues **sur ce ladder** passent à `cancelled` —
        exactement comme à l'acceptation d'une invitation, et pour la même raison : il a
        désormais une équipe, elles ne pourraient plus aboutir (`409 already_in_team`). Les
        laisser vivantes les afficherait encore dans `GET /teams/invitations/me` **et
        occuperait une place du plafond de 10 des équipes émettrices**. Aucune notification
        (personne n'a rien refusé).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ladderId: { type: string, format: uuid }
                name:
                  type: string
                  minLength: 1
                  maxLength: 50
                  example: Bisounours
                logoUrl:
                  type: string
                  format: uri
                  pattern: '^https://'
                  maxLength: 2048
                  description: >
                    **Optionnel.** URL **https** du logo, posée dès la création. Mêmes règles
                    qu'au `PATCH /teams/{id}` : `http://` et les autres schémas d'URI
                    (`javascript:`, `ftp:`…) sont refusés (400). Absent → `logo_url` reste
                    `null`. `null` n'est **pas** accepté ici (on ne retire pas un logo sur une
                    team qui n'existe pas encore). C'est une **URL**, pas un upload de fichier.
              required: [ladderId, name]
      responses:
        '201':
          description: Team créée (capitaine ajouté comme membre)
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    $ref: '#/components/schemas/Team'
                required: [team]
        '400':
          description: Body invalide (ValidationError) ou ladder 1v1 (Error)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Ladder inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Nom déjà pris sur ce ladder, ou déjà dans une team sur ce ladder (23505)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCreateConflict'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Teams]
      summary: Mes équipes
      description: >
        Toutes mes teams, tous jeux et ladders confondus (une par ladder).
        Liste vide si aucune.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mes teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeamListItem'
                required: [teams]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /teams/{id}:
    get:
      tags: [Teams]
      summary: Détail d'une équipe
      description: >
        Team + ladder aplati + liste des membres (le capitaine y figure
        avec isCaptain=true).


        **Divulgation progressive (B-INV)** : `isMember` dit si l'appelant fait partie de
        l'équipe, et le tableau `invitations` (les sollicitations encore `pending`) n'est
        présent **que pour un membre**. Un visiteur ne doit pas apprendre qui a été
        sollicité — le champ est alors **absent**, pas vide (même choix que `lineup` sur
        `GET /teams/{id}/matches`).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Détail de la team
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    $ref: '#/components/schemas/TeamDetail'
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeamMember'
                  isMember:
                    type: boolean
                    description: L'appelant fait-il partie de cette équipe ?
                  invitations:
                    type: array
                    description: >
                      Invitations encore **en attente**, les plus anciennes d'abord.
                      **Présent uniquement si `isMember` est vrai.**
                    items:
                      $ref: '#/components/schemas/TeamInvitation'
                required: [team, members, isMember]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Team inconnue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Teams]
      summary: Éditer une équipe (nom et/ou logo)
      description: >
        **Capitaine only.** Modifie le **nom** et/ou le **logo** de l'équipe. Les deux
        champs sont optionnels mais **au moins un** est requis (corps vide → 400).
        `logoUrl` accepte `null` pour **retirer** le logo, et n'accepte que les URL
        **https** (I4 : une URL `http://` produirait du contenu mixte sur la page HTTPS).
        C'est une **URL**, pas un upload de fichier (un envoi de logo
        vers MinIO, comme l'avatar utilisateur, serait un endpoint séparé). Renommer
        vers un nom déjà pris sur le même ladder viole `unique(ladder_id, name)` →
        **409**.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              # Seuls `name` et `logoUrl` sont éditables. Le runtime Zod retire déjà les
              # champs inconnus (une tentative de mass assignment sur `captainId` est
              # neutralisée) ; `additionalProperties: false` aligne le contrat publié sur
              # ce comportement au lieu d'annoncer l'inverse par défaut.
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: Nouveau nom (trimé), même règle qu'à la création.
                logoUrl:
                  type: string
                  format: uri
                  pattern: '^https://'
                  maxLength: 2048
                  nullable: true
                  description: >
                    URL **https** du logo, ou `null` pour le retirer. `http://` et les
                    autres schémas d'URI (`javascript:`, `ftp:`…) sont **refusés** (400) :
                    `http://` produirait du contenu mixte, et une valeur persistée pourrait
                    plus tard atterrir dans un `<a href>` ou du CSS.
      responses:
        '200':
          description: Équipe mise à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    $ref: '#/components/schemas/Team'
                required: [team]
        '400':
          description: >
            Param `:id` non-uuid, corps vide (aucun champ à modifier), `name` vide ou
            > 50, `logoUrl` non conforme à une URL **https**.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Réservé au capitaine de l'équipe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Équipe inconnue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Nom déjà pris par une autre équipe du même ladder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Teams]
      summary: Dissoudre une équipe
      description: >
        Supprime la team (capitaine only). Les membres **et les invitations en attente**
        partent en **cascade DB** — les invités ne sont pas notifiés (l'équipe qui les
        sollicitait n'existe plus).


        ⚠️ **Refusée (409 `team_engaged_in_match`) tant qu'un camp de l'équipe est engagé**
        dans un match `pending`, `in_progress`, `awaiting_confirmation` ou `disputed` :
        `match_sides.team_id` est en `set null`, dissoudre laisserait un camp **sans équipe**
        — un slot orphelin invisible dans les listes mais toujours acceptable par son id.


        ⚠️ Écrit sous le **même verrou consultatif d'équipe** que les routes d'invitation, pris
        **avant** le `SELECT … FOR UPDATE`. La cascade fait de cette route une écrivaine de
        `team_invitations` — sans ce verrou elle s'interbloquait avec une acceptation
        concurrente (elle tient la ligne `teams`, l'acceptation tient la ligne d'invitation,
        chacune veut celle de l'autre), et c'est le **capitaine** qui recevait un `500` sur une
        dissolution parfaitement légitime.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Team dissoute (cascade sur les membres)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Seul le capitaine peut dissoudre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Team inconnue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            Un camp de l'équipe est engagé dans un match non terminé. Le client doit tester
            `code`, **pas** parser `error`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [team_engaged_in_match] }
                required: [error, code]
        '500':
          $ref: '#/components/responses/InternalError'

  /teams/{id}/logo:
    post:
      tags: [Teams]
      summary: Uploader le logo d'une équipe
      description: >
        **Capitaine only.** Upload multipart (limite **2 MB**, globale). MIME autorisés :
        image/jpeg, image/png, image/webp — **pas** de PDF (contrairement aux preuves de
        dispute : un logo est forcément une image). Stocke l'objet dans le bucket **public
        `avatars`** (le même que les avatars utilisateurs : un logo d'équipe est tout aussi
        public, et un bucket dédié coûterait de l'env + du compose pour zéro gain) puis écrit
        `logo_url`.


        Complète `PATCH /teams/{id}`, qui n'accepte qu'une URL **https** déjà hébergée
        ailleurs. ⚠️ Le `logoUrl` renvoyé ici est un **chemin RELATIF**
        `/media/avatars/<uuid>.<ext>`, il ne commence donc **pas** par `https://` : il est
        fabriqué par le serveur, pas saisi par un client (la règle https ne protège que les
        URL saisies). Le front doit accepter les deux formes.


        L'ancien logo est supprimé de MinIO s'il était hébergé chez nous ; s'il s'agissait
        d'une URL externe héritée, il n'y a rien à supprimer. Un échec de suppression est
        **loggé, pas propagé** (même politique que `DELETE /users/me/avatar`).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                logo:
                  type: string
                  format: binary
                  description: >
                    Le fichier image (jpeg/png/webp, ≤ 2 MB). ⚠️ Le serveur prend la
                    **première partie fichier** de la requête (`request.file()`), comme
                    `POST /users/me/avatar` : le nom `logo` est la convention du contrat,
                    il n'est pas vérifié. Envoyer une seule partie fichier.
              required: [logo]
      responses:
        '200':
          description: Logo mis à jour (`team.logoUrl` pointe sur le nouvel objet)
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    $ref: '#/components/schemas/Team'
                required: [team]
        '400':
          description: >
            Param `:id` non-uuid, corps non multipart, aucun fichier envoyé, ou type MIME
            non supporté (`application/pdf` inclus).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Réservé au capitaine de l'équipe (un membre simple est refusé)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Équipe inconnue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Fichier trop volumineux (> 2 MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /teams/{id}/matches:
    get:
      tags: [Teams]
      summary: Historique de match d'une équipe (B15)
      description: >
        Historique des matchs où cette équipe a un side, triés par `scheduledAt`
        **décroissant** (`NULLS LAST`). 100 % lecture, réponse de forme **différente selon
        le rôle** — `isMember` est renvoyé à la racine pour que le front n'ait pas à le
        redéduire :


        - **Membre** de l'équipe : voit **tous** les matchs, y compris les slots `pending`
        sans adversaire (`opponent: null`), et reçoit la **composition nominative**
        (`lineup`) des deux camps.


        - **Non-membre** (ou anonyme rejeté en 401) : ne voit **que** les matchs où un
        adversaire a déjà accepté (2 sides) — un slot `pending`, ou périmé puis passé
        `cancelled` par le job 24 h, reste invisible (même anonymisation que
        `GET /matches?ladderId=`). `lineup` est **absent** de la réponse.


        `disputeId`/`disputeStatus` sont exposés **quel que soit le statut du match** —
        contrairement à `GET /matches/{id}`, qui ne les remonte que pour un match
        `disputed` : après arbitrage un match repasse `completed`/`cancelled` mais la
        dispute reste `resolved`, et le badge « litige » de l'historique doit rester
        visible. `GET /disputes/{id}` garde sa propre garde d'accès.


        `score` peut être `null` sur un match **`completed`** : un arbitrage admin
        (`POST /disputes/{id}/resolve`) tranche un vainqueur, pas un score.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Historique de match (peut être vide)
          content:
            application/json:
              schema:
                type: object
                properties:
                  isMember:
                    type: boolean
                    description: Le compte appelant est-il membre de cette équipe ?
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        status: { type: string }
                        scheduledAt: { type: string, format: date-time, nullable: true }
                        completedAt: { type: string, format: date-time, nullable: true }
                        opponent:
                          nullable: true
                          description: >
                            `null` tant qu'aucun adversaire n'a accepté. N'arrive jamais pour
                            un non-membre : ces matchs sont filtrés de la liste.
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string }
                            logoUrl: { type: string, nullable: true }
                          required: [id, name, logoUrl]
                        score:
                          type: object
                          description: >
                            Score final Bo3 (manches gagnées) des deux camps. Chaque champ est
                            `null` avant clôture ET après un arbitrage admin.
                          properties:
                            self: { type: integer, nullable: true }
                            opponent: { type: integer, nullable: true }
                          required: [self, opponent]
                        eloDelta:
                          type: integer
                          nullable: true
                          description: >
                            Delta d'Elo de l'équipe consultée UNIQUEMENT sur ce match ; `null`
                            tant que le match n'est pas `completed`.
                        result:
                          type: string
                          nullable: true
                          enum: [win, loss]
                          description: Dérivé de `winnerSideId` côté serveur ; `null` sans vainqueur.
                        disputeId:
                          type: string
                          format: uuid
                          nullable: true
                        disputeStatus:
                          type: string
                          nullable: true
                          enum: [open, resolved]
                        lineup:
                          type: object
                          description: >
                            **Présent uniquement si `isMember` est `true`.** Absent de la
                            réponse pour un non-membre — aucune composition n'est exposée.
                          properties:
                            self:
                              type: array
                              items:
                                type: object
                                properties:
                                  id: { type: string, format: uuid }
                                  pseudo: { type: string }
                                  displayName: { type: string, nullable: true }
                                  avatarUrl: { type: string, nullable: true }
                                required: [id, pseudo, displayName, avatarUrl]
                            opponent:
                              type: array
                              items:
                                type: object
                                properties:
                                  id: { type: string, format: uuid }
                                  pseudo: { type: string }
                                  displayName: { type: string, nullable: true }
                                  avatarUrl: { type: string, nullable: true }
                                required: [id, pseudo, displayName, avatarUrl]
                          # Dès que `lineup` est là (membre), les DEUX clés le sont : le
                          # handler construit toujours `{ self, opponent }`, et `opponent`
                          # vaut `[]` sur un slot sans adversaire — jamais absent.
                          required: [self, opponent]
                      required:
                        [id, status, scheduledAt, completedAt, opponent, score, eloDelta, result, disputeId, disputeStatus]
                required: [isMember, matches]
        '400':
          description: Param :id non-uuid (ValidationError)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Équipe inconnue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ⚠️ `POST /teams/{id}/members` (ajout FORCÉ d'un membre) a été SUPPRIMÉE par B-INV.
  # Elle permettait au capitaine d'inscrire un joueur sans son accord — et comme
  # `team_members_user_ladder_unique` n'autorise qu'une équipe par ladder, cet ajout
  # VERROUILLAIT le joueur sur tout le ladder. Elle est remplacée par le cycle
  # d'invitation ci-dessous. Le retrait d'un membre (`DELETE .../members/{userId}`),
  # lui, est INCHANGÉ.
  /teams/{id}/invitations:
    post:
      tags: [Teams]
      summary: Inviter un joueur dans l'équipe
      description: >
        **Capitaine only.** Crée une invitation `pending` : le joueur **ne devient PAS
        membre** ici, il doit accepter. Gardes : le joueur existe, n'est pas déjà membre,
        n'a pas déjà une équipe sur ce ladder, n'a pas déjà une invitation en attente de
        cette équipe, et `membres + invitations en attente < 10`.


        Le plafond est vérifié **sous verrous consultatifs** (`pg_advisory_xact_lock`) :
        deux invitations simultanées ne peuvent pas le franchir ensemble. Deux clés sont
        prises, **triées** — celle de l'équipe (le plafond) et celle du couple
        (joueur, ladder) (la règle « une seule équipe par ladder »), le même jeu que
        l'acceptation.


        Plusieurs équipes **peuvent** inviter le même joueur sur un même ladder : seule
        l'**acceptation** est exclusive. Le client doit tester `code`, pas la prose de
        `error`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                userId: { type: string, format: uuid }
              required: [userId]
      responses:
        '201':
          description: Invitation créée (le joueur est notifié, il n'est pas encore membre)
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitation:
                    $ref: '#/components/schemas/TeamInvitation'
                required: [invitation]
        '400':
          description: Param `:id` non-uuid, ou `userId` absent/non-uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Réservé au capitaine (`code: not_captain`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitationError'
        '404':
          description: 'Équipe (`team_not_found`) ou joueur (`user_not_found`) inconnu'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitationError'
        '409':
          description: >
            Refus métier : `already_member` (déjà dans l'équipe, couvre l'auto-invitation),
            `already_in_team_on_ladder` (le joueur a déjà une équipe sur ce ladder),
            `already_invited` (invitation déjà en attente pour ce couple),
            `roster_full` (membres + invitations en attente = 10).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /teams/{id}/invitations/{invitationId}:
    delete:
      tags: [Teams]
      summary: Annuler une invitation en attente
      description: >
        **Capitaine only.** Passe l'invitation à `cancelled` et **libère la place** du
        roster : une nouvelle invitation vers le même joueur redevient possible (l'index
        d'unicité est **partiel**, restreint aux `pending`).


        ⚠️ À ne pas confondre avec `DELETE /teams/{id}/members/{userId}` (le **kick**), qui
        retire un joueur **déjà membre**. Ici le joueur n'a jamais rejoint l'équipe.
        Aucune notification n'est émise (le capitaine est l'acteur).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Invitation annulée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Param non-uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Réservé au capitaine (`code: not_captain`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitationError'
        '404':
          description: >
            Équipe inconnue (`team_not_found`), ou aucune invitation **en attente** avec cet
            id dans cette équipe (`invitation_not_found` — couvre l'invitation déjà répondue,
            déjà annulée, ou appartenant à une autre équipe).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /teams/invitations/me:
    get:
      tags: [Teams]
      summary: Mes invitations en attente
      description: >
        Les invitations **que j'ai reçues** et qui sont encore `pending`, la plus récente
        d'abord. Les invitations acceptées, refusées ou annulées n'y figurent pas.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mes invitations en attente (liste vide si aucune)
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyTeamInvitation'
                required: [invitations]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /teams/invitations/{invitationId}/accept:
    post:
      tags: [Teams]
      summary: Accepter une invitation
      description: >
        **Réservé au joueur invité.** Crée l'appartenance **et**, dans la **même
        transaction**, passe à `cancelled` les autres invitations `pending` du joueur **sur
        ce ladder** (elles ne pourraient plus aboutir : une seule équipe par ladder).


        Le plafond des 10 est **re-vérifié sous verrou** ici : entre l'invitation et
        l'acceptation, l'équipe a pu se remplir. Le capitaine est notifié
        (`team_invitation_accepted`).


        ⚠️ **DEUX verrous consultatifs, pris dans un ordre trié** : celui de l'équipe
        (le plafond, un agrégat) **et** celui du couple (joueur, ladder). Le second n'est
        pas décoratif : cette route écrit deux ressources dont la portée est le joueur et
        **pas** l'équipe — l'index unique `team_members_user_ladder_unique`, et
        l'annulation en cascade qui met à jour des invitations **d'autres équipes**. Avec
        le seul verrou d'équipe, deux acceptations du **même joueur** sur **deux équipes du
        même ladder** prennent des clés disjointes, se croisent sur les verrous de ligne et
        **s'interbloquent** : Postgres tue une transaction et ce conflit métier sortait en
        **500** au lieu de `409 already_in_team` (reproduit 8 fois sur 8).
      security:
        - bearerAuth: []
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Invitation acceptée, le joueur est désormais membre
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  teamId:
                    type: string
                    format: uuid
                    description: L'équipe rejointe (le front peut y naviguer directement).
                required: [ok, teamId]
        '400':
          description: Param `:invitationId` non-uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Cette invitation est adressée à quelqu''un d''autre (`not_your_invitation`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitationError'
        '404':
          description: 'Invitation inconnue (`invitation_not_found`) ou équipe dissoute (`team_not_found`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitationError'
        '409':
          description: >
            `not_pending` (déjà acceptée, refusée ou annulée entre-temps), `roster_full`
            (l'équipe s'est remplie depuis l'invitation), `already_in_team` (j'ai rejoint
            une autre équipe de ce ladder entre-temps).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /teams/invitations/{invitationId}/decline:
    post:
      tags: [Teams]
      summary: Refuser une invitation
      description: >
        **Réservé au joueur invité.** Passe l'invitation à `declined` et **libère la place**
        du roster. Le capitaine est notifié (`team_invitation_declined`) et peut réinviter.
      security:
        - bearerAuth: []
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Invitation refusée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Param `:invitationId` non-uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Cette invitation est adressée à quelqu''un d''autre (`not_your_invitation`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitationError'
        '404':
          description: 'Invitation inconnue (`invitation_not_found`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitationError'
        '409':
          description: 'Invitation déjà acceptée, refusée ou annulée (`not_pending`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /teams/{id}/members/{userId}:
    delete:
      tags: [Teams]
      summary: Retirer un membre (kick ou quit)
      description: >
        Retire un membre : autorisé au capitaine (kick) ou au membre lui-même
