openapi: 3.0.3
info:
  title: ft_transcendence API
  description: >
    API REST du backend ft_transcendence (Fastify v5 + TypeScript).
    Auth JWT (access token Bearer 15 min) + refresh token en cookie httpOnly
    (SameSite=Strict, Path=/auth). Chat temps réel hors-OpenAPI via WebSocket
    `/ws/chat` (documenté en fin de fichier pour mémoire).
  version: 0.7.0
  contact:
    name: ft_transcendence team

servers:
  - url: https://localhost:3000
    description: Dev local (HTTPS, certificat auto-signé)

tags:
  - name: Auth
    description: Inscription, connexion, session, refresh
  - name: OAuth
    description: Connexion Google (OAuth 2.0)
  - name: 2FA
    description: Double authentification TOTP
  - name: Users
    description: Profil utilisateur et avatar
  - name: External accounts
    description: Liaisons de comptes in-game (§5.1 — requis pour jouer)
  - name: Friends
    description: Demandes d'amis et liste d'amis
  - name: Messages
    description: Historique des messages directs
  - name: Blocks
    description: Blocage symétrique d'utilisateurs (rompt l'amitié, masque le profil)
  - name: Games
    description: Catalogue des jeux supportés (lecture seule, seed initial)
  - name: Ladders
    description: Compétitions = jeu × format (lecture seule, seed initial)
  - name: System
    description: Endpoints utilitaires

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token signé (payload `{ sub }`). Les tempTokens 2FA
        (`{ sub, pending: 'totp' }`) sont refusés sur les routes protégées.

  schemas:
    # ---------- Erreurs ----------
    Error:
      type: object
      properties:
        error:
          type: string
          example: Unauthorized
      required: [error]

    ValidationError:
      type: object
      description: Erreur de validation Zod (issues brutes).
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: too_small
              path:
                type: array
                items:
                  type: string
              message:
                type: string
                example: au moins 8 caractères
      required: [errors]

    Ok:
      type: object
      properties:
        ok:
          type: boolean
          example: true
      required: [ok]

    # ---------- User ----------
    User:
      type: object
      description: Profil complet du user authentifié (sans passwordHash ni totpSecret).
      properties:
        id:
          type: string
          format: uuid
        pseudo:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        oauthProvider:
          type: string
          nullable: true
          example: google
        oauthId:
          type: string
          nullable: true
        totpEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, pseudo, email, totpEnabled, createdAt, updatedAt]

    PublicUser:
      type: object
      description: >
        Profil public (GET /users/{pseudo}) — email, updatedAt, totpEnabled
        et secrets retirés.
      properties:
        id:
          type: string
          format: uuid
        pseudo:
          type: string
        displayName:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        oauthProvider:
          type: string
          nullable: true
        oauthId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, pseudo, createdAt]

    FriendSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pseudo:
          type: string
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true

    # ---------- Friendship ----------
    Friendship:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requesterId:
          type: string
          format: uuid
        addresseeId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ---------- Message ----------
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        receiverId:
          type: string
          format: uuid
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    # ---------- Auth payloads ----------
    AuthSuccess:
      type: object
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required: [accessToken, user]

    Requires2FA:
      type: object
      properties:
        requires2FA:
          type: boolean
          example: true
        tempToken:
          type: string
          description: Token temporaire (TTL 5 min) à présenter à POST /auth/2fa/verify.
      required: [requires2FA, tempToken]

    # ---------- Blocks ----------
    BlockEntry:
      type: object
      description: Un user bloqué (retourné par GET /blocks).
      properties:
        id:
          type: string
          format: uuid
        pseudo:
          type: string
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        since:
          type: string
          format: date-time
          description: createdAt de la ligne `blocks`.
      required: [id, pseudo, since]

    # ---------- Catalog (games + ladders) ----------
    Game:
      type: object
      description: Un jeu supporté par la plateforme.
      properties:
        id:
          type: string
          description: Slug du jeu (PK).
          example: cs2
        name:
          type: string
          example: Counter-Strike 2
        requiredProvider:
          type: string
          enum: [riot, steam, epic, chess_com]
          description: Provider d'identifiant in-game requis pour s'inscrire à un match de ce jeu.
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, name, requiredProvider, isActive, createdAt]

    Ladder:
      type: object
      description: Une compétition (jeu × format) avec son ELO indépendant.
      properties:
        id:
          type: string
          format: uuid
        gameId:
          type: string
          example: cs2
        format:
          type: string
          enum: ['1v1', '2v2', '3v3', '5v5']
        name:
          type: string
          example: Counter-Strike 2 5v5
        lockoutMinutes:
          type: integer
          description: >
            Durée pendant laquelle la team/user est verrouillée après le début
            d'un match. Aussi le délai minimum avant soumission de score.
          example: 60
        createdAt:
          type: string
          format: date-time
      required: [id, gameId, format, name, lockoutMinutes, createdAt]

    # ---------- External accounts (in-game) ----------
    ExternalAccount:
      type: object
      description: Un compte externe (in-game) lié par l'user (§5.1 du design).
      properties:
        provider:
          type: string
          enum: [riot, steam, epic, chess_com]
        externalId:
          type: string
          description: Identifiant du compte chez le provider (saisi manuellement au MVP).
          example: STEAM_76561198000000000
        verified:
          type: boolean
          description: >
            true si la liaison a été vérifiée (OAuth futur). Au MVP toujours false
            (liaison manuelle déclarative).
      required: [provider, externalId, verified]

  responses:
    Unauthorized:
      description: Token absent, invalide ou expiré
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Erreur interne
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  # =====================================================================
  # AUTH
  # =====================================================================
  /auth/register:
    post:
      tags: [Auth]
      summary: Créer un compte
      description: >
        Crée un user, hash le password (bcrypt cost 12), pose le cookie refresh
        et renvoie un access token. Password fort exigé.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pseudo:
                  type: string
                  minLength: 3
                  maxLength: 30
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  description: >
                    ≥ 8 caractères, au moins une majuscule, une minuscule,
                    un chiffre et un caractère spécial.
              required: [pseudo, email, password]
      responses:
        '201':
          description: Compte créé
          headers:
            Set-Cookie:
              description: refresh (httpOnly, Secure, SameSite=Strict, Path=/auth, 7j)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccess'
        '400':
          description: Validation échouée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: Pseudo ou email déjà pris
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Se connecter
      description: >
        Vérifie email + password. Si 2FA activée, renvoie `{ requires2FA, tempToken }`
        SANS cookie ni accessToken. Sinon flux normal. Comptes OAuth-only
        (sans password) renvoient 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required: [email, password]
      responses:
        '200':
          description: Connexion réussie OU 2FA requise
          headers:
            Set-Cookie:
              description: refresh (seulement si 2FA non activée)
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthSuccess'
                  - $ref: '#/components/schemas/Requires2FA'
        '400':
          description: Validation échouée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil du user connecté
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renouveler l'access token
      description: Lit le cookie refresh et émet un nouvel access token.
      responses:
        '200':
          description: Nouvel access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                required: [accessToken]
        '401':
          description: Refresh token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Se déconnecter
      description: Efface le cookie refresh.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'

  # =====================================================================
  # OAUTH GOOGLE
  # =====================================================================
  /auth/oauth/google/start:
    get:
      tags: [OAuth]
      summary: Démarrer le flow Google
      description: >
        Redirige (302) vers l'écran de consentement Google. Route fournie
        par @fastify/oauth2 (startRedirectPath). Scopes : profile, email.
      responses:
        '302':
          description: Redirection vers Google

  /auth/oauth/google/callback:
    get:
      tags: [OAuth]
      summary: Callback Google
      description: >
        Échange le code, récupère le profil Google, applique le linking
        3-cas (A: déjà lié / B: lié par email / C: nouveau compte), pose le
        cookie refresh et renvoie un access token.
      parameters:
        - in: query
          name: code
          schema:
            type: string
          description: Code d'autorisation fourni par Google
        - in: query
          name: state
          schema:
            type: string
      responses:
        '200':
          description: Connexion OAuth réussie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccess'
        '500':
          description: Échec du login OAuth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # =====================================================================
  # 2FA TOTP
  # =====================================================================
  /auth/2fa/setup:
    post:
      tags: [2FA]
      summary: Initialiser la 2FA
      description: Génère un secret base32 + QR code (data URL). Stocke le secret.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Secret + QR code
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                    description: Secret base32 (à saisir manuellement si besoin)
                  qrCodeDataUrl:
                    type: string
                    description: Image PNG en data URL pour l'app TOTP
                required: [secret, qrCodeDataUrl]
        '400':
          description: 2FA déjà activée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/2fa/enable:
    post:
      tags: [2FA]
      summary: Activer la 2FA
      description: Vérifie le 1er code TOTP et passe totp_enabled à true.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: '^\d{6}$'
                  example: '123456'
              required: [code]
      responses:
        '200':
          description: 2FA activée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Code invalide, 2FA non configurée ou déjà activée
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/2fa/disable:
    post:
      tags: [2FA]
      summary: Désactiver la 2FA
      description: Exige un code TOTP valide, puis reset secret + flag.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: '^\d{6}$'
              required: [code]
      responses:
        '200':
          description: 2FA désactivée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Code invalide ou 2FA non activée
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/2fa/verify:
    post:
      tags: [2FA]
      summary: Vérifier le code 2FA au login
      description: >
        Consomme le tempToken renvoyé par /auth/login, vérifie le code TOTP,
        puis émet un vrai access token + cookie refresh. Pas d'auth Bearer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tempToken:
                  type: string
                code:
                  type: string
                  pattern: '^\d{6}$'
              required: [tempToken, code]
      responses:
        '200':
          description: Connexion finalisée
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccess'
        '400':
          description: Code invalide, 2FA non activée ou validation échouée
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationError'
        '401':
          description: tempToken invalide/expiré ou mauvais type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # =====================================================================
  # USERS
  # =====================================================================
  /users/me:
    get:
      tags: [Users]
      summary: Mon profil
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Users]
      summary: Modifier mon profil
      description: Mise à jour partielle de displayName et/ou bio (au moins un champ).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 50
                bio:
                  type: string
                  maxLength: 280
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Aucun champ fourni ou validation échouée
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Users]
      summary: Supprimer mon compte
      description: >
        Suppression définitive. Exige `password` si l'user en a un (sinon ignoré
        pour les comptes OAuth-only) et `totpCode` si la 2FA est activée. Supprime
        en cascade friendships, messages, blocks. L'avatar MinIO est aussi
        retiré (non-bloquant). Le cookie refresh est nettoyé.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Requis si user a un password_hash.
                totpCode:
                  type: string
                  pattern: '^\d{6}$'
                  description: Requis si totp_enabled.
      responses:
        '200':
          description: Compte supprimé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Validation échouée (champ requis manquant)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationError'
        '401':
          description: Password ou code TOTP invalide, ou token absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me/avatar:
    post:
      tags: [Users]
      summary: Uploader un avatar
      description: >
        Upload multipart (limite 2 MB). MIME autorisés : image/jpeg, image/png,
        image/webp. Stocke dans MinIO et met à jour avatar_url.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        '200':
          description: Avatar mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Pas multipart, aucun fichier ou type non supporté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Fichier trop volumineux (> 2 MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # =====================================================================
  # EXTERNAL ACCOUNTS (in-game)
  # =====================================================================
  /users/me/external-accounts:
    get:
      tags: [External accounts]
      summary: Liste mes comptes externes liés
      description: >
        Renvoie les liaisons in-game de l'user authentifié (0 à 4, une par
        provider). Liste vide si aucune liaison — pas une erreur (jamais 404).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des comptes liés
          content:
            application/json:
              schema:
                type: object
                properties:
                  externalAccounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalAccount'
                required: [externalAccounts]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [External accounts]
      summary: Lier un compte externe
      description: >
        Lie un compte in-game à l'user (MVP manuel → `verified = false`).
        Un seul compte par provider (contrainte UNIQUE(user_id, provider)).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum: [riot, steam, epic, chess_com]
                externalId:
                  type: string
                  minLength: 1
                  example: Faker#KR1
              required: [provider, externalId]
      responses:
        '201':
          description: Liaison créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  externalAccount:
                    $ref: '#/components/schemas/ExternalAccount'
                required: [externalAccount]
        '400':
          description: Body invalide (provider hors enum, externalId vide)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Provider déjà lié pour cet user (SQLSTATE 23505)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me/external-accounts/{provider}:
    delete:
      tags: [External accounts]
      summary: Délier un compte externe
      description: >
        Retire la liaison de ce provider pour l'user. Idempotent
        (200 même si aucune liaison existante).
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [riot, steam, epic, chess_com]
      responses:
        '200':
          description: Liaison retirée (ou aucune existante)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Provider invalide (hors enum)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{pseudo}:
    get:
      tags: [Users]
      summary: Profil public d'un user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: pseudo
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/PublicUser'
        '404':
          description: Profil introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # =====================================================================
  # FRIENDS
  # =====================================================================
  /friends:
    post:
      tags: [Friends]
      summary: Envoyer une demande d'ami
      description: >
        Logique 4-cas : pas de relation → pending (201) ; demande inverse
        existante → auto-accept (200) ; même sens pending → 400 ;
        déjà amis → 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                addresseeId:
                  type: string
                  format: uuid
              required: [addresseeId]
      responses:
        '201':
          description: Demande créée (pending)
          content:
            application/json:
              schema:
                type: object
                properties:
                  friendship:
                    $ref: '#/components/schemas/Friendship'
        '200':
          description: Demande inverse auto-acceptée
          content:
            application/json:
              schema:
                type: object
                properties:
                  friendship:
                    $ref: '#/components/schemas/Friendship'
        '400':
          description: Soi-même, déjà demandé ou déjà amis
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationError'
        '404':
          description: User cible introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Friends]
      summary: Liste de mes amis
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  friends:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/FriendSummary'
                        - type: object
                          properties:
                            since:
                              type: string
                              format: date-time
        '500':
          $ref: '#/components/responses/InternalError'

  /friends/requests:
    get:
      tags: [Friends]
      summary: Demandes d'amis reçues (pending)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        sentAt:
                          type: string
                          format: date-time
                        from:
                          $ref: '#/components/schemas/FriendSummary'
        '500':
          $ref: '#/components/responses/InternalError'

  /friends/{id}/accept:
    post:
      tags: [Friends]
      summary: Accepter une demande
      description: Seul l'addressee peut accepter.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Demande acceptée
          content:
            application/json:
              schema:
                type: object
                properties:
                  friendship:
                    $ref: '#/components/schemas/Friendship'
        '400':
          description: Déjà amis (status non pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Non autorisé (pas l'addressee)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Amitié introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /friends/{id}/reject:
    post:
      tags: [Friends]
      summary: Refuser une demande
      description: Seul l'addressee peut refuser. La ligne est supprimée.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Demande refusée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Status non pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Amitié introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /friends/{id}:
    delete:
      tags: [Friends]
      summary: Supprimer un ami
      description: >
        Unfriend d'une amitié acceptée. Les deux parties (requester ou
        addressee) peuvent supprimer.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Amitié supprimée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Pas d'amitié active à supprimer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Amitié introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # =====================================================================
  # MESSAGES
  # =====================================================================
  /messages/{friendId}:
    get:
      tags: [Messages]
      summary: Historique de conversation
      description: >
        Renvoie les 100 derniers messages échangés avec un ami (ordre
        chronologique). Réservé aux amitiés acceptées.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: friendId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
        '403':
          description: Pas amis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # =====================================================================
  # BLOCKS
  # =====================================================================
  /blocks:
    get:
      tags: [Blocks]
      summary: Liste des users que j'ai bloqués
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des blocages
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocks:
                    type: array
                    items:
                      $ref: '#/components/schemas/BlockEntry'
                required: [blocks]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /blocks/{userId}:
    post:
      tags: [Blocks]
      summary: Bloquer un user
      description: >
        Bloque l'user et rompt toute amitié existante entre les deux
        (DELETE friendship dans les deux sens). Pas idempotent : un 2e
        appel renvoie 400 'already blocked'.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Blocage effectué
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Auto-blocage tenté ou déjà bloqué (SQLSTATE 23505)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User cible introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Blocks]
      summary: Débloquer un user
      description: >
        Retire la ligne `blocks` de moi vers cet user. Idempotent
        (200 même si pas bloqué).
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Déblocage effectué (ou aucun blocage existant)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # =====================================================================
  # GAMES
  # =====================================================================
  /games:
    get:
      tags: [Games]
      summary: Liste les jeux supportés
      description: Renvoie tous les jeux avec `is_active = true`, triés par nom.
      responses:
        '200':
          description: Liste des jeux actifs
          content:
            application/json:
              schema:
                type: object
                properties:
                  games:
                    type: array
                    items:
                      $ref: '#/components/schemas/Game'
                required: [games]
        '500':
          $ref: '#/components/responses/InternalError'

  /games/{id}:
    get:
      tags: [Games]
      summary: Détails d'un jeu
      description: Lookup par slug (`lol`, `cs2`, `val`, `rl`, `chess`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: cs2
      responses:
        '200':
          description: Le jeu demandé
          content:
            application/json:
              schema:
                type: object
                properties:
                  game:
                    $ref: '#/components/schemas/Game'
                required: [game]
        '404':
          description: Jeu inconnu ou inactif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # =====================================================================
  # LADDERS
  # =====================================================================
  /ladders:
    get:
      tags: [Ladders]
      summary: Liste les ladders
      description: >
        Renvoie tous les ladders triés par nom. Filtre optionnel par
        `gameId` (slug du jeu). Un `gameId` inconnu renvoie une liste vide
        (pas d'erreur).
      parameters:
        - name: gameId
          in: query
          required: false
          schema:
            type: string
            example: cs2
          description: Filtre les ladders pour un jeu donné.
      responses:
        '200':
          description: Liste des ladders
          content:
            application/json:
              schema:
                type: object
                properties:
                  ladders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ladder'
                required: [ladders]
        '500':
          $ref: '#/components/responses/InternalError'

  /ladders/{id}:
    get:
      tags: [Ladders]
      summary: Détails d'un ladder (avec son jeu joint)
      description: >
        Lookup par uuid du ladder. Renvoie le ladder + le jeu parent
        (JOIN pour éviter au frontend un 2e appel sur `GET /games/{id}`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Le ladder demandé et son jeu parent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ladder:
                    $ref: '#/components/schemas/Ladder'
                  game:
                    $ref: '#/components/schemas/Game'
                required: [ladder, game]
        '404':
          description: Ladder inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /ladders/{id}/rankings:
    get:
      tags: [Ladders]
      summary: Classement (leaderboard) d'un ladder
      description: >
        Renvoie le classement du ladder, trié par ELO décroissant. Chaque
        entrée porte un `competitor` qui est soit un joueur (`type: user`),
        soit une équipe (`type: team`) selon le ladder. Un ladder existant
        sans classement renvoie une liste vide (pas d'erreur).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Classement trié par ELO décroissant (peut être vide)
          content:
            application/json:
              schema:
                type: object
                properties:
                  rankings:
                    type: array
                    items:
                      type: object
                      properties:
                        rank:
                          type: integer
                          example: 1
                        elo:
                          type: integer
                          example: 1580
                        wins:
                          type: integer
                        losses:
                          type: integer
                        competitor:
                          oneOf:
                            - type: object
                              properties:
                                type:
                                  type: string
                                  enum: [user]
                                pseudo:
                                  type: string
                                displayName:
                                  type: string
                                  nullable: true
                                avatarUrl:
                                  type: string
                                  nullable: true
                              required: [type, pseudo]
                            - type: object
                              properties:
                                type:
                                  type: string
                                  enum: [team]
                                name:
                                  type: string
                                logoUrl:
                                  type: string
                                  nullable: true
                              required: [type, name]
                      required: [rank, elo, wins, losses, competitor]
                required: [rankings]
        '404':
          description: Ladder inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # =====================================================================
  # SYSTEM
  # =====================================================================
  /ping:
    get:
      tags: [System]
      summary: Healthcheck
      responses:
        '200':
          description: pong
          content:
            text/plain:
              schema:
                type: string
                example: "pong-from-docker"

# =======================================================================
# WebSocket (hors OpenAPI — documenté pour mémoire)
# =======================================================================
# GET (upgrade) /ws/chat?token=<accessToken>
#   - Auth : token JWT en query string (sub). Fermeture 1008 si invalide.
#   - À la connexion : SADD online_users <userId> (Redis).
#   - Message entrant (JSON) : { "to": "<uuid>", "content": "1..1000 chars" }
#       * vérifie l'amitié acceptée, sinon ignore silencieusement
#       * persiste en DB puis push au destinataire si connecté
#   - Message sortant au destinataire : { "type": "message", "message": <Message> }
#   - Accusé à l'expéditeur     : { "type": "message_sent", "message": <Message> }