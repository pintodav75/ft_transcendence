  # =====================================================================
  # SYSTEM
  # =====================================================================
  /matches:
    post:
      tags: [Matchmaking]
      summary: Créer un slot de match (team ou solo 1v1)
      description: >
        Ouvre un slot (match en attente d'adversaire). Deux modes selon le format
        du ladder :
        • **2v2+** : un **capitaine** engage sa team avec une **lineup** (team déduite
        du ladder).
        • **1v1** : le **créateur** s'engage **seul** (lineup ignorée, side sans team).
        Maps BO3 tirées à la création (3 distinctes pour val/cs2 ; [] sinon).

        **Gardes** : §5.1 (compte externe lié) · **§5.2 disponibilité par FENÊTRE** ·
        grille horaire · plafond de 5 slots ouverts.

        **§5.2 — le modèle des fenêtres.** Chaque match occupe
        `[scheduledAt, scheduledAt + lockout_minutes]` (60 min en 5v5, 30 ailleurs).
        Un camp ne peut pas être engagé dans deux matchs dont les fenêtres se
        **chevauchent**. **À la création**, les slots `pending` comptent autant que les
        matchs actifs : on ne peut pas *proposer* deux créneaux qui se chevauchent.

        ⚠️ **Le « camp » est PAR LADDER** : en 2v2+ c'est la **team** ; en 1v1 c'est le couple
        **(joueur, ladder)**. Un joueur **peut donc** avoir un match d'échecs à 21h et un match
        Rocket League à 21h — c'est **assumé**. La plateforme n'observe pas les parties ; une
        absence se règle par **dispute → forfait**, et c'est une responsabilité humaine
        (le capitaine engage sa team en connaissance de cause).
        Les fenêtres qui se **touchent** ne se chevauchent PAS : on peut donc enchaîner
        21h–22h puis 22h–23h. Une team peut ainsi ouvrir **21h, 23h et 01h** en même
        temps et planifier sa soirée.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ladderId: { type: string, format: uuid }
                scheduledAt:
                  type: string
                  format: date-time
                  description: >
                    L'heure du match. **Doit tomber sur un quart fixe** (`:00`, `:15`,
                    `:30`, `:45` — secondes et ms à 0) et être **au moins 15 minutes
                    dans le futur** (borne incluse : à 20h45:00 on peut encore créer
                    pour 21h ; à 20h45:01, non). C'est LA référence temporelle du
                    match : §5.2 (disponibilité) et §5.3 (soumission de score) s'y
                    réfèrent. `startedAt`, lui, n'enregistre que l'instant de
                    l'acceptation — aucune règle ne le lit.
                  example: '2026-07-14T21:00:00.000Z'
                lineup:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
                  description: >
                    **Requise en 2v2+** : exactement format_size joueurs (2 / 3 / 5),
                    tous membres de la team, tous avec un compte lié pour le provider
                    du jeu, sans doublon. **Ignorée en 1v1** (le participant = le créateur).
              required: [ladderId, scheduledAt]
      responses:
        '201':
          description: Slot créé (side 0 = ma team, maps tirées)
          content:
            application/json:
              schema:
                type: object
                properties:
                  match:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      ladderId: { type: string, format: uuid }
                      status: { type: string, example: pending }
                      maps:
                        type: array
                        items: { type: string }
                        example: [Breeze, Split, Summit]
                      scheduledAt: { type: string, format: date-time }
                      createdAt: { type: string, format: date-time }
                required: [match]
        '400':
          description: >
            Body invalide (ValidationError) — dont **scheduledAt hors quart fixe**
            (ex. 21h07) ou **à moins de 15 min** ; en 2v2+ : lineup manquante/mauvaise
            taille, pas de team sur ce ladder, joueur hors team (Error) ;
            **§5.1 compte non lié** → en 2v2+ la réponse porte en plus `unlinkedPlayers`
            (UnlinkedPlayersError) ; en 1v1 c'est un Error simple.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/UnlinkedPlayersError'
                  - $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Seul le capitaine peut créer un match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ladder ou jeu inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            **§5.2** — le camp a déjà un match (slot ouvert **ou** match actif) dont la
            fenêtre **chevauche** celle demandée (`your team already has a match around
            that time`) ; **ou** il a atteint le **plafond de 5 slots ouverts** sur ce
            ladder. Les slots périmés ne comptent dans aucun des deux.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Matchmaking]
      summary: Lister les slots ouverts d'un ladder (anonyme)
      description: >
        Slots pending d'un ladder. Team créatrice ET maps masquées (anonymat) ;
        mes propres slots exclus. Ne renvoie que id / format / jeu / heure.

        ⚠️ Les slots **périmés** (à moins de 15 min de leur heure) sont **masqués** :
        plus personne ne peut les accepter. Le job les passera à `cancelled` à sa
        prochaine passe (à la minute) ; en attendant, ils ne sont pas listés.
      security:
        - bearerAuth: []
      parameters:
        - name: ladderId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Slots ouverts (anonymes)
          content:
            application/json:
              schema:
                type: object
                properties:
                  slots:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        format: { type: string, example: 2v2 }
                        gameId: { type: string, example: val }
                        scheduledAt: { type: string, format: date-time }
                required: [slots]
        '400':
          description: Query invalide (ladderId manquant ou non-uuid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Ladder inconnu
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: ladder not found }
        '500':
          $ref: '#/components/responses/InternalError'

  /matches/me:
    get:
      tags: [Matchmaking]
      summary: Mes matchs (tous ladders, tous statuts)
      description: >
        Les matchs qui **me concernent**, réunis depuis **deux sources** :
        • je suis dans `match_participants` → mes solos + les matchs où j'étais **aligné** ;
        • une de **mes teams** est engagée sur un side → y compris quand j'étais **sur le banc**
        (un membre du roster hors lineup n'a aucune ligne dans `match_participants` : sans cette
        seconde source il ne verrait pas le match de son équipe).
        Résultats dédoublonnés (un match d'équipe où j'ai joué remonte des deux sources) et
        triés du plus récent au plus ancien. **Rien n'est masqué ici** (maps visibles) —
        contrairement à `GET /matches?ladderId=`, ces matchs sont les miens.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mes matchs (tableau vide si aucun — pas une 404)
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        ladderId: { type: string, format: uuid }
                        status: { type: string, example: in_progress }
                        scheduledAt: { type: string, format: date-time, nullable: true }
                        startedAt: { type: string, format: date-time, nullable: true }
                        maps:
                          type: array
                          items: { type: string }
                          example: [Breeze, Split, Summit]
                required: [matches]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /matches/{id}:
    get:
      tags: [Matchmaking]
      summary: Détail enrichi d'un match (participants only)
      description: >
        Détail complet, prêt à afficher : l'**objet ladder** (nom, format, jeu — B16) ;
        pour chaque side, son **id**, son **état de soumission** (`submittedAt`,
        `submittedWinnerSideId` et les **deux scores soumis** — B6/B16), l'**objet team**
        (nom, logo, capitaine — `null` en 1v1) et les **joueurs** (pseudo, avatar),
        plus les maps. Sides **triés** (0 = créateur, 1 = accepteur).
        Réservé aux participants — **membre d'une team engagée** (2v2+, **banc compris**)
        **OU joueur du match** (1v1) — **SAUF si le match est `completed`** : un match
        terminé devient lisible par n'importe quel compte authentifié (page match publique,
        B15). Tout autre statut (`pending`, `in_progress`, `awaiting_confirmation`,
        `disputed`, `cancelled`) reste 403 pour un tiers — préserve l'anonymat des slots
        ouverts et des matchs en cours.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Détail du match
          content:
            application/json:
              schema:
                type: object
                properties:
                  match:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      ladderId: { type: string, format: uuid }
                      ladder:
                        type: object
                        description: >
                          Identité du ladder ET de son jeu, servie AVEC le match (B16) : la page
                          match se titre (« Counter-Strike 2 5v5 ») et décide d'afficher ou non
                          la section maps — seuls cs2 et Valorant ont un pool — sans un second
                          appel à `GET /ladders/{id}`. Toujours présent : `matches.ladder_id`
                          est une FK NOT NULL en `restrict`. ⚠️ `ladderId` reste exposé
                          juste au-dessus, à l'identique : aucun appelant existant ne bouge.
                        properties:
                          id: { type: string, format: uuid }
                          name: { type: string, example: Counter-Strike 2 5v5 }
                          format: { type: string, enum: ['1v1', '2v2', '3v3', '5v5'] }
                          gameId: { type: string, example: cs2 }
                          gameName: { type: string, example: Counter-Strike 2 }
                        required: [id, name, format, gameId, gameName]
                      status: { type: string }
                      scheduledAt: { type: string, format: date-time, nullable: true }
                      startedAt: { type: string, format: date-time, nullable: true }
                      completedAt: { type: string, format: date-time, nullable: true }
                      winnerSideId:
                        type: string
                        format: uuid
                        nullable: true
                        description: 'Side vainqueur une fois le match `completed` ; `null` sinon.'
                      maps:
                        type: array
                        items: { type: string }
                      createdAt: { type: string, format: date-time }
                      disputeId:
                        type: string
                        format: uuid
                        nullable: true
                        description: >
                          Id de la dispute quand le match est `disputed` — le front l'utilise
                          pour naviguer vers `GET /disputes/:id`. `null` dans tous les autres états.
                  sides:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: 'Id du side — à renvoyer comme `winnerSideId` dans POST /matches/:id/result.'
                        sideIndex: { type: integer, example: 0 }
                        submittedAt:
                          type: string
                          format: date-time
                          nullable: true
                          description: 'Instant où ce camp a soumis un résultat (B6) ; `null` sans soumission.'
                        submittedWinnerSideId:
                          type: string
                          format: uuid
                          nullable: true
                          description: 'Vainqueur déclaré par CE camp ; `null` sans soumission.'
                        submittedScoreSelf:
                          type: integer
                          nullable: true
                          description: >
                            Score Bo3 (manches gagnées : 0, 1 ou 2) que CE camp s'attribue à
                            LUI-MÊME dans sa soumission ; `null` tant qu'il n'a rien soumis
                            (donc `null` des deux côtés sur un match `in_progress`).
                        submittedScoreOpponent:
                          type: integer
                          nullable: true
                          description: >
                            Score Bo3 que CE camp attribue à l'ADVERSAIRE ; `null` sans
                            soumission. Exposé avec `submittedScoreSelf` depuis B16 parce que
                            **confirmer** un résultat, c'est renvoyer le MIROIR exact de la
                            soumission adverse (`scoreSelf`/`scoreOpponent` croisés) : sans ces
                            deux champs le front ne peut pas pré-remplir le bouton « Confirmer ».
                            ⚠️ Scores RELATIFS au soumetteur (« moi / lui »), jamais indexés sur
                            `sideIndex`. Même vainqueur mais score différent (2-0 vs 2-1) = litige.
                        score:
                          type: integer
                          nullable: true
                          description: >
                            Score final Bo3 (manches gagnées : 0, 1 ou 2) de ce camp, écrit
                            uniquement à la clôture (`completed`). Reste `null` après un
                            arbitrage admin (B7) : l'admin tranche un vainqueur, pas un score.
                        eloDelta:
                          type: integer
                          nullable: true
                          description: >
                            Gain/perte d'Elo sur CE match précis (ex. `+18` / `-12`). Dépend de
                            l'écart d'Elo au moment du match, donc non recalculable a posteriori
                            — `null` tant que le match n'est pas `completed`.
                        eloAfter:
                          type: integer
                          nullable: true
                          description: Elo de ce camp immédiatement après ce match ; `null` sinon.
                        team:
                          nullable: true
                          description: '`null` en 1v1 (le côté est un joueur, pas une team).'
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string, example: Los Ratones }
                            logoUrl: { type: string, nullable: true }
                            captainId: { type: string, format: uuid }
                        players:
                          type: array
                          description: La lineup engagée sur ce side (pas le roster entier).
                          items:
                            type: object
                            properties:
                              id: { type: string, format: uuid }
                              pseudo: { type: string, example: alice }
                              displayName: { type: string, nullable: true }
                              avatarUrl: { type: string, nullable: true }
                required: [match, sides]
        '400':
          description: Param :id non-uuid (ValidationError)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Non-participant du match, et le match n'est pas (encore) `completed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Match inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Matchmaking]
      summary: Annuler son slot ouvert
      description: >
        Passe le match à `cancelled` — on **n'efface pas** la ligne (l'historique est
        conservé). Réservé au **créateur**, c'est-à-dire au **side_index 0** :
        le **capitaine** de la team engagée (2v2+) ou le **joueur** du side (1v1).
        Idempotent (200 si déjà `cancelled`). L'update est **conditionnel**
        (`WHERE status = 'pending'`) : si quelqu'un accepte entre-temps → 409.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Slot annulé (ou déjà annulé — idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                required: [ok]
        '400':
          description: Param :id non-uuid (ValidationError)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Je ne suis pas le créateur (ni capitaine de la team engagée, ni le joueur solo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Match inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Le match n'est plus `pending` (accepté, terminé…) — rien n'est écrasé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /matches/{id}/accept:
    post:
      tags: [Matchmaking]
      summary: Accepter un slot ouvert (engager le side 1)
      description: >
        Engage le **second camp** d'un slot `pending`. Le côté de l'accepteur est validé
        **exactement comme celui du créateur** (même helper `validateSide`) : §5.1 compte
        externe lié, lineup (présente, de taille `format_size`, incluse dans le roster),
        garde capitaine, §5.2 lockout.
        • **2v2+** : un **capitaine d'une autre team** du même ladder, avec sa **lineup**.
        • **1v1** : le **joueur** s'engage seul (body facultatif, lineup ignorée).
        Effets (en **transaction**) : `status → in_progress`, `started_at = now()`
        (historique : l'instant de l'acceptation — **aucune règle ne le lit**, cf. §5.2),
        création du side 1 + ses participants, et **annulation des slots `pending` des deux
        camps QUI CHEVAUCHENT la fenêtre de ce match**.

        ⚠️ **Seuls les slots qui chevauchent tombent.** Une team qui a planifié 21h / 23h /
        01h et se fait accepter celui de 21h **garde** ceux de 23h et 01h : ils ne se
        recouvrent pas. (Annuler tous les slots ouverts, comme avant B5d, détruirait sa soirée.)

        ⚠️ **À l'accept, seuls les matchs ACTIFS bloquent** — pas mes slots `pending`. Un slot
        n'est qu'une **proposition** : m'engager pour de bon la rend caduque, et elle est
        justement retirée ci-dessus. La compter comme un blocage me refuserait un match à
        cause d'une offre que je m'apprête moi-même à annuler.

        L'update de statut est **conditionnel** : deux accepts simultanés → le second reçoit 409.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        description: Requis en 2v2+ (la lineup). **Aucun body en 1v1.**
        content:
          application/json:
            schema:
              type: object
              properties:
                lineup:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
                  description: >
                    **Requise en 2v2+** : exactement format_size joueurs (2 / 3 / 5), tous
                    membres de ma team, tous avec un compte lié pour le provider du jeu,
                    sans doublon. **Ignorée en 1v1.**
      responses:
        '200':
          description: Match accepté — il démarre
          content:
            application/json:
              schema:
                type: object
                properties:
                  match:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      ladderId: { type: string, format: uuid }
                      status: { type: string, example: in_progress }
                      startedAt: { type: string, format: date-time }
                      scheduledAt: { type: string, format: date-time, nullable: true }
                      maps:
                        type: array
                        items: { type: string }
                required: [match]
        '400':
          description: >
            Body/param invalide (ValidationError) ; **on ne peut pas accepter son propre slot**
            (vérifié **par team** en 2v2+, **par user_id** en 1v1 — les deux sides y ont
            `team_id = NULL`) ; en 2v2+ : lineup manquante/mauvaise taille, pas de team sur ce
            ladder, joueur hors roster ; **§5.1 compte non lié** → en 2v2+ la réponse porte
            en plus `unlinkedPlayers` (UnlinkedPlayersError) ; en 1v1 c'est un Error simple.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/UnlinkedPlayersError'
                  - $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Seul le capitaine peut engager sa team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Match, ladder ou jeu inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            Quatre causes.
            (1) Le match n'est plus `pending` (déjà accepté, annulé, terminé).
            (2) **Slot PÉRIMÉ** : il reste moins de **15 minutes** avant l'heure du match.
            Le job d'expiration tourne à la minute, donc un slot peut être mort mais encore
            `pending` en base — cette garde ferme la fenêtre.
            (3) **Course perdue sur CE match** : deux camps l'acceptent au même instant →
            l'update conditionnel n'en laisse passer qu'un, le second reçoit 409.
            (4) **§5.2 disponibilité** : la fenêtre de ce match **chevauche** un autre
            **match actif** de l'accepteur (`LOCKING_STATUSES`) — y compris quand il vient
            de s'engager **ailleurs au même instant**. Ses propres slots `pending` qui
            chevauchent ne comptent PAS à l'accept (ce sont des propositions, retirées par
            l'option A quand il s'engage) — seuls les matchs actifs bloquent. Fermé par un **verrou transactionnel**
            sur l'identité des DEUX camps, pris dans un **ordre déterministe** (sinon deux
            acceptations croisées provoquent un **interblocage** Postgres → 500), suivi d'une
            re-vérification **dans** la transaction : le second accept attend, relit, est refusé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /matches/{id}/result:
    post:
      tags: [Matchmaking]
      summary: Soumettre le résultat d'un match (déclarer le vainqueur)
      description: >
        Un camp déclare le **side gagnant** (`winnerSideId` = l'id d'un `match_sides`, PAS
        l'id du match) **et le score** de la série. Qui peut soumettre : **capitaine** en
        2v2+, **le joueur** en 1v1 (même règle que créer/accepter). Le match doit être
        `in_progress` ou `awaiting_confirmation`.

        🏆 **Tous les matchs sont en best-of-3** (décision produit, tous jeux/ladders
        confondus) : `scoreSelf`/`scoreOpponent` sont le nombre de manches gagnées (0 à 2),
        **relatifs au soumetteur** (« moi / lui »). Seuls scores valides : `2-0`, `2-1`,
        `0-2`, `1-2` — exactement un des deux camps doit atteindre 2 manches, et ce camp
        doit être celui déclaré vainqueur par `winnerSideId` (sinon 400).

        **§5.3** : impossible de soumettre **avant** l'heure prévue (`now() < scheduled_at`
        → 400) — la partie doit avoir commencé.

        **Machine à états (§5.4)**, selon la soumission de l'AUTRE camp :
        • l'autre n'a pas encore soumis → **1re soumission** : `status → awaiting_confirmation`.
        • l'autre a soumis le **même** vainqueur **ET** un score croisé cohérent (son
        `scoreSelf`/`scoreOpponent` correspond exactement à mon
        `scoreOpponent`/`scoreSelf`) → **accord** : `status → completed`, `winner_side_id` +
        `completed_at` posés, **le score final et l'ELO écrits sur les deux `match_sides`**
        (`score`, `eloDelta`, `eloAfter` — K=32 ; la ligne `rankings` du compétiteur est
        créée à 1000 à son 1er match). Tout dans la même transaction.
        • l'autre a soumis un vainqueur **différent**, OU le **même vainqueur avec un score
        différent** (ex. `2-0` contre `2-1`) → **désaccord** : `status → disputed` et une
        ligne `disputes` est ouverte (B7 prend le relais). Aucun ELO, aucun score écrit.

        **Re-soumission** : tant que le match n'est pas résolu (`in_progress` ou
        `awaiting_confirmation`), un camp peut re-soumettre — sa précédente déclaration
        (vainqueur **et scores**) est **écrasée** et `submitted_at` est remis à maintenant,
        ce qui **redémarre sa fenêtre d'auto-confirmation de 24 h**.

        Écritures sous **verrou consultatif** (clé = matchId) + re-lecture du statut **dans**
        la transaction : deux soumissions simultanées sont sérialisées.

        ⏰ **Jobs 24 h liés** (planificateur) : un match `in_progress` sans aucune soumission
        24 h après `scheduled_at` passe à `cancelled` ; un match `awaiting_confirmation` dont
        l'unique soumission date de +24 h (horloge sur `submitted_at`) est auto-confirmé
        (`completed` + ELO, score du camp qui a soumis) sur ce score.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [winnerSideId, scoreSelf, scoreOpponent]
              properties:
                winnerSideId:
                  type: string
                  format: uuid
                  description: >
                    Id du **side** déclaré vainqueur — doit être l'un des deux sides de CE
                    match. « Mon side » et le side vainqueur sont indépendants (on peut
                    déclarer la victoire de l'adversaire).
                scoreSelf:
                  type: integer
                  minimum: 0
                  maximum: 2
                  description: "Manches que JE (le soumetteur) me suis attribuées (best-of-3, 0 à 2)."
                scoreOpponent:
                  type: integer
                  minimum: 0
                  maximum: 2
                  description: "Manches que j'attribue à l'adversaire (best-of-3, 0 à 2)."
      responses:
        '200':
          description: Soumission enregistrée — renvoie le nouveau statut du match
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [awaiting_confirmation, completed, disputed]
                required: [status]
        '400':
          description: >
            Body/param invalide (ValidationError) ; score hors best-of-3 (ni `2-0`, `2-1`,
            `0-2` ni `1-2`) ; score incohérent avec le `winnerSideId` déclaré ; **§5.3** le
            match n'a pas encore commencé (`match not started yet`) ; ou `winnerSideId`
            n'est **pas un side de ce match**.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >
            L'appelant n'est pas habilité à soumettre (ni capitaine d'une team engagée, ni
            joueur solo du match). Vérifié **avant** l'état du match, pour ne pas donner
            d'oracle sur son statut à un non-participant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Match inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            Le match n'attend pas de résultat : il n'est ni `in_progress` ni
            `awaiting_confirmation` (déjà `completed` / `cancelled` / `disputed`, ou encore
            `pending`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /disputes:
    get:
      tags: [Disputes]
      summary: File d'arbitrage — disputes ouvertes (admin)
      description: >
        **Admin only** (`is_admin`) — liste les disputes encore `open`, **triées de la plus
        ancienne à la plus récente** (ordre de traitement). Chaque entrée porte le match, son
        ladder, l'heure prévue, la date d'ouverture et le **nombre de preuves déjà déposées**.
        C'est le point d'entrée de l'arbitre : sans lui, impossible de **découvrir** les litiges
        en attente sans connaître leur UUID.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Les disputes ouvertes
          content:
            application/json:
              schema:
                type: object
                properties:
                  disputes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        matchId: { type: string, format: uuid }
                        ladderId: { type: string, format: uuid }
                        scheduledAt: { type: string, format: date-time, nullable: true }
                        createdAt: { type: string, format: date-time }
                        evidenceCount: { type: integer, example: 2 }
                required: [disputes]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Réservé aux admins (`is_admin`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /disputes/{id}/evidence:
    post:
      tags: [Disputes]
      summary: Déposer une preuve (image ou PDF + message) sur une dispute
      description: >
        Un camp dépose une **preuve** dans le fil : un **fichier obligatoire**
        (image/png, image/jpeg, image/webp ou application/pdf — ≤ 5 Mo, stocké dans un
        **bucket MinIO privé**) **+ un message** d'explication. Réservé au **capitaine** (2v2+) / **joueur** (1v1) d'un
        des deux camps. Plusieurs posts par camp autorisés (le fil est un dialogue asynchrone).
        La dispute doit être encore `open`. Le fichier est **entièrement validé en mémoire avant
        tout upload** (message présent, type supporté) → aucun objet orphelin ; l'insert en base
        se fait sous **verrou** (clé = matchId) avec re-vérification `open` → aucune preuve
        n'atterrit sur une dispute close entre-temps. La garde de camp est vérifiée **avant** de
        révéler si la dispute est résolue (pas d'oracle d'état pour un inconnu).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [evidence, message]
              properties:
                evidence:
                  type: string
                  format: binary
                  description: >-
                    Fichier de preuve (image/png, image/jpeg, image/webp ou application/pdf),
                    ≤ 5 Mo.
                message:
                  type: string
                  minLength: 1
                  description: Explication accompagnant la preuve.
      responses:
        '201':
          description: >
            Preuve enregistrée. La réponse **n'expose pas** l'URL de la preuve (la colonne
            interne stocke une clé d'objet privée) : recharger `GET /disputes/{id}` pour obtenir
            l'URL présignée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  evidence:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      disputeId: { type: string, format: uuid }
                      matchSideId: { type: string, format: uuid }
                      submittedByUserId: { type: string, format: uuid, nullable: true }
                      message: { type: string }
                      submittedAt: { type: string, format: date-time }
                required: [evidence]
        '400':
          description: >
            Param :id non-uuid (ValidationError) ; body pas en `multipart/form-data` ;
            image manquante, type non supporté ou champ fichier ≠ `evidence` ; message
            manquant/vide ; **structure hors bornes** (plus d'un fichier, plus d'un champ, ou
            plus de deux parties — une preuve = 1 image + 1 message).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Ni capitaine (2v2+) ni joueur (1v1) d'un des deux camps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Dispute inconnue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: La dispute n'est plus `open` (déjà résolue)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Fichier trop volumineux (> 5 Mo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /disputes/{id}:
    get:
      tags: [Disputes]
      summary: Détail d'une dispute + déclarations des camps + fil de preuves
      description: >
        Rend l'état de la dispute (statut, résolution, note d'arbitrage, date), **ce que chaque
        camp a déclaré** (les `sides` : index, identité de la team ou du joueur, et
        `submittedWinnerSideId` = le vainqueur annoncé par ce camp) et le **fil de preuves trié
        par date** — chaque post avec son image, son message, son camp (`matchSideId`) et son
        auteur (pseudo/avatar). Ce sont les `sides` qui rendent l'arbitrage possible : l'admin
        voit qui est le side 0/1 et ce que chacun a annoncé, puis choisit `side_0_wins` /
        `side_1_wins`. Lecture ouverte à tout **participant du match** (banc compris, même garde
        que `GET /matches/:id`) **OU à un admin**. Projection explicite — aucun champ privé.
        Chaque `evidenceUrl` est une **URL présignée courte durée** (bucket privé), générée
        seulement après la garde. Reste consultable après résolution (historique).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Détail de la dispute
          content:
            application/json:
              schema:
                type: object
                properties:
                  dispute:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      matchId: { type: string, format: uuid }
                      status: { type: string, enum: [open, resolved] }
                      resolution:
                        type: string
                        enum: [side_0_wins, side_1_wins, cancelled]
                        nullable: true
                        description: '`null` tant que la dispute est `open`.'
                      resolutionNotes: { type: string, nullable: true }
                      resolvedAt: { type: string, format: date-time, nullable: true }
                  sides:
                    type: array
                    description: >
                      Les deux camps, triés par `sideIndex` (0 = créateur, 1 = accepteur).
                      `submittedWinnerSideId` = le side que CE camp a déclaré vainqueur (B6).
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        sideIndex: { type: integer, enum: [0, 1] }
                        submittedWinnerSideId:
                          type: string
                          format: uuid
                          nullable: true
                          description: Vainqueur annoncé par ce camp ; `null` si pas de soumission.
                        team:
                          nullable: true
                          description: '`null` en 1v1 (pas de team).'
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string }
                            logoUrl: { type: string, nullable: true }
                            captainId: { type: string, format: uuid }
                        players:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string, format: uuid }
                              pseudo: { type: string, example: alice }
                              displayName: { type: string, nullable: true }
                              avatarUrl: { type: string, nullable: true }
                  evidence:
                    type: array
                    description: Le fil, trié par `submittedAt` croissant.
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        matchSideId: { type: string, format: uuid }
                        evidenceUrl:
                          type: string
                          description: URL présignée courte durée (bucket privé), valable ~5 min.
                        message: { type: string, nullable: true }
                        submittedAt: { type: string, format: date-time }
                        author:
                          nullable: true
                          description: '`null` si l''auteur a supprimé son compte.'
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            pseudo: { type: string, example: alice }
                            displayName: { type: string, nullable: true }
                            avatarUrl: { type: string, nullable: true }
                required: [dispute, sides, evidence]
        '400':
          description: Param :id non-uuid (ValidationError)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Ni participant du match (banc compris) ni admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Dispute inconnue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /disputes/{id}/resolve:
    post:
      tags: [Disputes]
      summary: Arbitrer une dispute (admin)
      description: >
        **Admin only** (`is_admin`) — c'est LA sortie de l'état `disputed`. L'admin tranche :
        • `side_0_wins` / `side_1_wins` → match `completed` + **ELO** appliqué (helper partagé
        avec B6, K=32) ; • `cancelled` → match `cancelled`, **ELO inchangé** (cas où l'admin ne
        peut pas départager). La dispute passe `resolved` (résolution + note + arbitre + date),
        le match sort de `disputed` → **les deux camps sont libérés** (§5.2).
        **Définitif** : ré-arbitrer une dispute close → 409. Écrit sous **verrou consultatif**
        (clé = matchId, le même que `/matches/:id/result` et les jobs) + re-lecture sous verrou.
        Le **job 24 h** applique l'issue `cancelled` automatiquement si aucun admin ne passe.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution:
                  type: string
                  enum: [side_0_wins, side_1_wins, cancelled]
                  description: L'issue choisie par l'arbitre.
                notes:
                  type: string
                  maxLength: 1000
                  description: Note de résolution (facultative), visible par les deux camps.
      responses:
        '200':
          description: Dispute résolue
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: resolved }
                  resolution:
                    type: string
                    enum: [side_0_wins, side_1_wins, cancelled]
                required: [status, resolution]
        '400':
          description: Param :id non-uuid ou `resolution` hors enum (ValidationError)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Réservé aux admins (`is_admin`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Dispute inconnue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            La dispute est déjà résolue (ou le match n'est plus `disputed`) — course avec un
            autre arbitrage ou le job 24 h, rattrapée par la re-lecture sous verrou.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /notifications:
    get:
      tags: [Notifications]
      summary: Mes notifications (paginées) + compteur non-lu
      description: >
        Les notifications de l'utilisateur courant, **plus récentes d'abord**, paginées par
        **curseur** (keyset sur `(createdAt, id)` — un offset sauterait des lignes, la liste
        bouge en permanence). `unreadCount` compte TOUTES mes non-lues (pas seulement la
        page) : c'est le badge de la cloche. `nextCursor` = l'id à repasser en `cursor`
        pour la page suivante ; `null` quand on est au bout. Les 13 types possibles :
        `match_accepted`, `result_submitted`, `result_confirmed`, `dispute_opened`,
        `dispute_resolved`, `dispute_auto_cancelled`, `match_ghost_cancelled`,
        `dispute_needs_admin` (admins seulement), `friend_request_received`,
        `friend_request_accepted` (social), `team_member_added`, `team_member_removed`,
        `team_disbanded` (équipe). `data` est un payload **display-safe**
        (ids, heure, pseudo — jamais d'email/hash) : pour les types **match/dispute**,
        `matchId` + `ladderId` toujours, plus `disputeId` (types dispute), `winnerSideId`
        (result_confirmed), `scheduledAt` (match_accepted) et `resolution`
        (dispute_resolved) ; pour les types **social**, `friendshipId` + l'auteur
        (`fromUserId`/`fromPseudo` pour reçue, `byUserId`/`byPseudo` pour acceptée) ;
        pour les types **équipe**, `teamId` + `teamName` + `ladderId` + l'auteur
        (`byUserId`/`byPseudo`). ⚠️ `teamName` est un **instantané** : indispensable pour
        `team_disbanded`, puisque l'équipe n'existe plus quand le destinataire lit la
        notification. Il n'existe volontairement **pas** de type pour la création ni pour
        l'édition d'une équipe : personne d'autre que l'acteur n'est concerné.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          description: Id de la dernière notification de la page précédente (`nextCursor`).
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Mes notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        type:
                          type: string
                          enum:
                            [
                              match_accepted,
                              result_submitted,
                              result_confirmed,
                              dispute_opened,
                              dispute_resolved,
                              dispute_auto_cancelled,
                              match_ghost_cancelled,
                              dispute_needs_admin,
                              friend_request_received,
                              friend_request_accepted,
                              team_member_added,
                              team_member_removed,
                              team_disbanded,
                            ]
                        data:
                          type: object
                          description: Payload display-safe (matchId, ladderId, …selon le type).
                        readAt: { type: string, format: date-time, nullable: true }
                        createdAt: { type: string, format: date-time }
                  unreadCount: { type: integer, example: 3 }
                  nextCursor: { type: string, format: uuid, nullable: true }
                required: [notifications, unreadCount, nextCursor]
        '400':
          description: >
            `limit`/`cursor` invalides (ValidationError, schéma Zod), ou curseur inconnu —
            un curseur appartenant à un AUTRE user renvoie le même 400 (pas d'oracle).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Marquer une notification comme lue
      description: >
        **Idempotente** : re-marquer une notification déjà lue → 200 sans toucher `readAt`
        (on garde l'horodatage de la première lecture). N'agit que sur MES notifications :
        l'id d'un autre user → le **même 404** qu'un id inexistant (pas d'oracle).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Notification marquée lue (ou déjà lue)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                required: [ok]
        '400':
          description: Param :id non-uuid (ValidationError)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Notification inconnue OU appartenant à un autre utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Marquer toutes mes notifications comme lues
      description: >
        Marque lues TOUTES mes notifications non-lues. **Idempotente** (deuxième appel :
        `updated: 0`). `updated` = nombre de notifications effectivement marquées.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Fait
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  updated: { type: integer, example: 4 }
                required: [ok, updated]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /search:
    get:
      tags: [Search]
      summary: Recherche globale préfixe (joueurs + teams)
      description: >
        Cherche les **joueurs** (par `pseudo`) et les **teams** (par `name`) dont le nom
        **commence par** `q`, **insensible à la casse**. Résultats fusionnés en une seule
        liste, chaque item tagué `type: user | team`. **Exclut les blocages** (joueurs que
        j'ai bloqués OU qui m'ont bloqués — les teams ne sont pas filtrées). Jamais de champ
        privé (`email`, hash). Les jokers SQL (`%`, `_`) dans `q` sont échappés → traités
        comme du texte littéral.


        **Filtre** (`type`), **tri** et **pagination** (`limit`/`offset`) s'appliquent à
        la **liste fusionnée**, pas à chaque source : joueurs et teams sont triés
        **ensemble** par nom (une team peut donc précéder un joueur) et `limit`/`offset`
        découpent ce résultat global. `limit` borne donc le **nombre total** d'items
        rendus. Les ex æquo sont départagés par `type` puis `id` : l'ordre est **total**,
        donc stable d'un appel à l'autre — condition nécessaire pour qu'`offset` ne saute
        ni ne duplique de résultat. `hasMore` indique s'il reste une page après celle-ci.
        Une page au-delà du total renvoie simplement une liste vide.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Préfixe recherché (trimé, 2 à 50 caractères).
          schema: { type: string, minLength: 2, maxLength: 50 }
        - name: type
          in: query
          required: false
          description: >
            Filtre par type. Absent → joueurs **et** teams. `user` → joueurs seulement,
            `team` → teams seulement.
          schema: { type: string, enum: [user, team] }
        - name: limit
          in: query
          required: false
          description: Nombre maximum d'items rendus, toutes sources confondues.
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: offset
          in: query
          required: false
          description: Décalage dans la liste fusionnée et triée.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Résultats (liste vide si aucun match)
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      oneOf:
                        - type: object
                          description: Résultat joueur
                          properties:
                            type: { type: string, enum: [user] }
                            id: { type: string, format: uuid }
                            pseudo: { type: string }
                            displayName: { type: string, nullable: true }
                            avatarUrl: { type: string, nullable: true }
                          required: [type, id, pseudo, displayName, avatarUrl]
                        - type: object
                          description: Résultat team
                          properties:
                            type: { type: string, enum: [team] }
                            id: { type: string, format: uuid }
                            name: { type: string }
                            logoUrl: { type: string, nullable: true }
                            ladderId: { type: string, format: uuid }
                          required: [type, id, name, logoUrl, ladderId]
                  hasMore:
                    type: boolean
                    description: >
                      `true` s'il existe au moins un résultat après cette page
                      (`offset + limit`). Permet au front de savoir s'il doit proposer
                      « voir plus » sans avoir à compter le total.
                required: [results, hasMore]
        '400':
          description: >
            `q` manquant, trop court (< 2) ou trop long (> 50) ; `type` hors enum ;
            `limit` hors 1-50 ou non numérique ; `offset` négatif.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /ping:
    get:
      tags: [System]
      summary: Healthcheck
      responses:
        '200':
          description: pong
          content:
            text/plain:
              schema:
                type: string
                example: "pong-from-docker"

# =======================================================================
# WebSocket (hors OpenAPI — documenté pour mémoire)
# =======================================================================
# GET (upgrade) /ws/chat?token=<accessToken>
#   - Navigateur : wss://localhost:5173/api/ws/chat?token=<accessToken> (proxy Vite ws:true,
#     retrait du préfixe /api). Direct/tests : wss://localhost:3000/ws/chat?token=...
#   - Auth : token JWT en query string (sub). Fermeture 1008 si invalide OU si tempToken 2FA.
#   - À la connexion : SADD online_users <userId> (Redis).
#   - Message entrant (JSON) : { "to": "<uuid>", "content": "1..1000 chars" }
#       * vérifie l'amitié acceptée, sinon ignore silencieusement
#       * persiste en DB puis push au destinataire si connecté
#   - Message sortant au destinataire : { "type": "message", "message": <Message> }
#   - Accusé à l'expéditeur     : { "type": "message_sent", "message": <Message> }
#
# Event `notification` (B9) — poussé sur CE MÊME socket (un seul WS par client) :
#   { "type": "notification",
#     "notification": { "id": "<uuid>", "type": "<notification_type>",
#                       "data": { ...display-safe, cf. GET /notifications },
#                       "readAt": null, "createdAt": "<ISO>" } }
#   - Best-effort : émis APRÈS le commit de la transaction métier ; un destinataire hors
#     ligne ne reçoit rien en live et récupère tout au prochain GET /notifications.
#   - Aucun message ENTRANT associé : les notifs se lisent/marquent via l'API REST.
